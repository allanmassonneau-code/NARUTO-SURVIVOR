const borne = (v, a, b) => (v < a ? a : v > b ? b : v);

function dirDepuisVecteur(x, y) { return Math.abs(x) >= Math.abs(y) ? (x >= 0 ? 'droite' : 'gauche') : (y >= 0 ? 'bas' : 'haut'); }

// ── Hasard reproductible ─────────────────────────────────────────────────────
// sfc32 : générateur 32 bits à état explicite (4 entiers), sérialisable.
function hacher(chaine) { // cyrb128 → 4 entiers 32 bits
  let h1 = 1779033703, h2 = 3144134277, h3 = 1013904242, h4 = 2773480762;
  for (let i = 0; i < chaine.length; i++) {
    const k = chaine.charCodeAt(i);
    h1 = h2 ^ Math.imul(h1 ^ k, 597399067); h2 = h3 ^ Math.imul(h2 ^ k, 2869860233);
    h3 = h4 ^ Math.imul(h3 ^ k, 951274213); h4 = h1 ^ Math.imul(h4 ^ k, 2716044179);
  }
  h1 = Math.imul(h3 ^ (h1 >>> 18), 597399067); h2 = Math.imul(h4 ^ (h2 >>> 22), 2869860233);
  h3 = Math.imul(h1 ^ (h3 >>> 17), 951274213); h4 = Math.imul(h2 ^ (h4 >>> 19), 2716044179);
  return [(h1 ^ h2 ^ h3 ^ h4) >>> 0, (h2 ^ h1) >>> 0, (h3 ^ h1) >>> 0, (h4 ^ h1) >>> 0];
}
class Alea {
  constructor(graine) { this.s = Array.isArray(graine) ? graine.slice() : hacher(String(graine)); for (let i = 0; i < 12; i++) this.suivant(); }
  suivant() { // [0,1)
    let [a, b, c, d] = this.s;
    a >>>= 0; b >>>= 0; c >>>= 0; d >>>= 0;
    const t = (a + b | 0) + d | 0;
    d = d + 1 | 0; a = b ^ b >>> 9; b = c + (c << 3) | 0; c = c << 21 | c >>> 11; c = c + t | 0;
    this.s = [a, b, c, d];
    return (t >>> 0) / 4294967296;
  }
  entier(n) { return Math.floor(this.suivant() * n); }            // [0, n)
  entre(a, b) { return a + this.suivant() * (b - a); }
  entierEntre(a, b) { return a + this.entier(b - a + 1); }         // [a, b]
  chance(p) { return this.suivant() < p; }
  choix(t) { return t.length ? t[this.entier(t.length)] : undefined; }
  melanger(t) { for (let i = t.length - 1; i > 0; i--) { const j = this.entier(i + 1); [t[i], t[j]] = [t[j], t[i]]; } return t; }

  pondere(liste, poids) {

    let r = this.suivant() * total;
    for (let i = 0; i < liste.length; i++) { r -= w[i]; if (r < 0 && w[i] > 0) return liste[i]; }
    for (let i = liste.length - 1; i >= 0; i--) if (w[i] > 0) return liste[i];
    return undefined;
  }
  etat() { return this.s.slice(); }
}

const GAMMES = {
  in: [0, 1, 5, 7, 8],        // miyako-bushi : étrange, tendu
  yo: [0, 2, 5, 7, 9],        // plus ouvert
  ryukyu: [0, 4, 5, 7, 11],
  sombre: [0, 1, 3, 7, 8],

const Musique = {
  A: null, piste: null, pas: 0, prochain: 0, minuteur: null, couches: null, combat: 0, cibleCombat: 0,
  init(A) {
    this.A = A; if (this.piste) this.prochain = A.ctx.currentTime + 0.1;
    const c = A.ctx;
    this.gAmb = c.createGain(); this.gPerc = c.createGain(); this.gAmb.gain.value = 1; this.gPerc.gain.value = 0;
    this.gAmb.connect(A.busMusique); this.gPerc.connect(A.busMusique);
    this.minuteur = setInterval(() => this.planifier(), 25);
  },
  // Une piste est générée de façon déterministe depuis son nom : mélodie originale.
  jouerPiste(nom, opts = {}) {
    if (this.piste && this.piste.nom === nom) return;
    const r = new Alea('musique|' + nom);
    const gamme = GAMMES[opts.gamme || 'in'];
    const racine = opts.racine || 50; // MIDI
    const tempo = opts.tempo || 84;
    const mesures = 8, pasParMesure = 16;
    // motif rythmique et mélodie en marche aléatoire bornée
    const melodie = [];
    let deg = 7;
    for (let m = 0; m < mesures; m++) {
      const rythme = r.choix([[0, 4, 6, 8, 12], [0, 3, 6, 10, 12, 14], [0, 8, 10, 12], [0, 2, 4, 8, 11, 12], [0, 6, 8, 14]]);
      for (const p of rythme) {
        if (m % 4 === 3 && p > 8) continue; // respiration en fin de phrase
        deg = borne(deg + r.choix([-2, -1, -1, 1, 1, 2, 0, 3, -3]), 2, 13);
        melodie.push({ pas: m * pasParMesure + p, deg, dur: r.choix([2, 2, 3, 4, 6]) });
      }
    }

  planifier() {

const CONTOUR = '#1c1420';   // contour sombre commun à tous les sprites

// Corps procéduraux (14 × 11) : modes standard / combinaison / veste / manteau
function carteCorps(vue, frame, mode) {
  const vide = () => Array(14).fill('.');
  const L = []; for (let y = 0; y < 11; y++) L.push(vide());
  const set = (y, s) => { for (let x = 0; x < s.length; x++) if (s[x] !== '.') L[y][x] = s[x]; };
  const pas = frame % 2 === 1; const cotePas = frame === 1 ? 1 : frame === 3 ? -1 : 0;
  if (vue === 'face' || vue === 'dos') {
    set(0, '....cccccc....');
    set(1, '..tttttttttt..');
    set(2, '.atttttttttTA.');
    set(3, '.atttttttttTA.');
    set(4, '.atttttttttTA.');
    set(5, vue === 'face' ? '.kttttttttttk.' : '.kTTTTTTTTTTk.');
    set(6, '..eeeeeeeeee..');
    if (mode === 'manteau') {

  } else { // côté, tourné vers la droite
    set(0, '.....cccc.....');
    set(1, '....tttttt....');
    set(2, '....tttttTT...');
    set(3, '....ttttttT...');
    set(4, '....ttttttT...');
    set(5, '....tttttTT...');
    set(6, '....eeeeeee...');
    if (mode === 'manteau') {
      for (let y = 1; y <= 9; y++) for (let x = 4; x <= 10; x++) L[y][x] = x >= 9 ? 'T' : 't';
      set(10, pas ? '...ff....ff...' : '....fffff.....');
      const bx = pas ? (frame === 1 ? 8 : 5) : 7; L[3][bx] = 'a'; L[4][bx] = 'a'; L[5][bx] = 'k';
      return L;
    }
    if (!pas) { set(7, '.....ppppP....'); set(8, '.....ppppP....'); set(9, '.....ppppP....'); set(10, '.....fffff....'); }
    else { set(7, '....pP..pP....'); set(8, '...pP....pP...'); set(9, '..pP......pP..'); set(10, '..ff......fff.'); }
    const bx = pas ? (frame === 1 ? 9 : 5) : 7; const by = pas ? 2 : 3;
    L[by][bx] = 'a'; L[by + 1][bx] = 'a'; L[by + 2][bx] = 'a'; L[Math.min(6, by + 3)][bx] = 'k';
    if (mode === 'veste') { for (const y of [1, 2, 3, 4, 5]) { L[y][4] = 'v'; L[y][9] = 'V'; } }
  }

}

// Couleurs d'yeux par style
function couleursYeux(style) {
  switch (style) {
    case 'byakugan': return { e: '#c9c2e6', w: '#ffffff' };
    case 'cerne': return { e: '#2a8a84', w: '#d8fff4' };
    case 'kakuzu': return { e: '#3aa060', w: '#c8303a' };
    case 'sharingan': return { e: '#c81e28', w: '#ffd0d0' };
    case 'rinnegan': return { e: '#8a78c8', w: '#e8e0ff' };
    default: return { e: '#1c1420', w: '#ffffff' };
  }
}

// Assemble une tête (vue, état) → toile 26×22 contournée
function construireTete(V, vue, etat) {
  const base = carteTeteBase(vue === 'dos' ? 'dos' : vue);
  const co = COIFFURES[V.coiffure][vue];
  for (let y = 0; y < co.length; y++) for (let x = 0; x < co[y].length && x < 26; x++) { const k = co[y][x]; if (k !== '.') base[y][x] = k; }
  // Style des yeux (avant clignement)
  if (vue !== 'dos') {
    const st = V.yeux || 'normal';
    if (st === 'etroit') for (let y = 13; y <= 14; y++) for (let x = 0; x < 26; x++) if (base[y][x] === 'e' || base[y][x] === 'w') base[y][x] = y === 13 ? 'm' : 's';
    if (st === 'cerne') { for (let y = 12; y <= 17; y++) for (let x = 0; x < 26; x++) if ((base[y][x] === 's' || base[y][x] === 'd') && [[0, 1], [0, -1], [1, 0], [-1, 0]].some(([dx, dy]) => { const q = (base[y + dy] || [])[x + dx]; return q === 'e' || q === 'w'; })) base[y][x] = 'C'; }
    if (st === 'fente') for (let y = 13; y <= 16; y++) for (let x = 0; x < 26; x++) if (base[y][x] === 'e' && (x === 7 || x === 9 || x === 16 || x === 18)) base[y][x] = 'Y';
    if (V.sourcils) { for (const [x0, x1] of [[6, 10], [15, 19]]) for (let x = x0; x <= x1; x++) { if (vue === 'cote' && x < 14) continue; base[12][x] = 'h'; base[11][x] = x === x0 || x === x1 ? base[11][x] : 'h'; } }
  }
  if (etat === 'cligne' || etat === 'tir') {
    // yeux fermés : on garde la ligne la plus basse de chaque œil
    for (let x = 0; x < 26; x++) {
      let bas = -1; for (let y = 12; y <= 17; y++) if (['e', 'w', 'Y'].includes(base[y][x])) bas = y;
      if (bas < 0) continue;
      for (let y = 12; y <= 17; y++) if (['e', 'w', 'Y'].includes(base[y][x])) base[y][x] = (etat === 'tir' ? y === bas - 1 : y === bas) ? 'e' : 's';
    }
    if (etat === 'tir' && vue === 'face') { base[18][12] = 'm'; base[18][13] = 'm'; base[19][12] = 'M'; base[19][13] = 'M'; }
  }
  const yeux = couleursYeux(V.yeux);
  const couleurs = Object.assign({ s: PEAU.s, d: PEAU.d, l: PEAU.l, m: '#6a3424', M: '#a04040', C: '#1c1420', Y: '#e8e0d0' }, yeux, V.c);
  if (V.yeux === 'fente') couleurs.Y = '#f0e6c8';
  return contourner(peindre(base.map(r => r.join('')), couleurs, 26, 22));
}
function construireCorps(V, vue, frame) {
  const P = V.corps; const L = carteCorps(vue, frame, P.mode);
  const couleurs = Object.assign({ k: PEAU.s }, P);
  if (V.nuages) { couleurs.n = '#c8303a'; couleurs.N = '#f0ece4'; // nuages rouges bordés de blanc sur le manteau
    const pos = vue === 'cote' ? [[5, 3], [7, 7]] : [[3, 3], [9, 6], [5, 8]];
    for (const [x, y] of pos) if (L[y] && (L[y][x] === 't' || L[y][x] === 'T')) { L[y][x] = 'n'; if (L[y][x + 1] === 't') L[y][x + 1] = 'N'; }
  }

}
function construireDos(V, vue) {
  if (!V.dos) return null;
  if (V.dos === 'gourde') {

    return contourner(peindre(face, { o: '#8a6a3a', p: '#d0a868', P: '#a8844a' }, 8, 11));
  }
  if (V.dos === 'marionnette') {
    const m = ['..wwww..', '.wWwwWw.', '.wwwwww.', 'wWwwwwWw', 'wwwwwwww', 'wwWwwWww', '.wwwwww.', '.wWwwWw.', '..wwww..'];
    return contourner(peindre(m, { w: '#e6dcc4', W: '#b8a888' }, 8, 9));

// Construit toutes les images d'un personnage : tetes[vue][etat], corps[vue][frame]
const _cachePersos = {};
function spritesPerso(cle) {
  if (_cachePersos[cle]) return _cachePersos[cle];
  const V = VISUELS[cle] || VISUELS.naruto; const S = { tetes: {}, corps: {}, dos: {} };
  for (const vue of ['face', 'cote', 'dos']) {
    S.tetes[vue] = {}; for (const e of ['normal', 'cligne', 'tir']) S.tetes[vue][e] = construireTete(V, vue, e);
    S.corps[vue] = []; for (let f = 0; f < 4; f++) S.corps[vue].push(construireCorps(V, vue, f));
  }
  S.tetes.gauche = {}; for (const e of ['normal', 'cligne', 'tir']) S.tetes.gauche[e] = miroir(S.tetes.cote[e]);
  S.corps.gauche = S.corps.cote.map(miroir);
  S.dosAcc = construireDos(V, 'dos');
  _cachePersos[cle] = S; return S;
}
// Dessine un personnage : dirCorps / dirTete ∈ haut|bas|gauche|droite
function dessinerPerso(g, cle, x, y, o = {}) {
  const S = spritesPerso(cle);
  const vueDe = d => d === 'haut' ? 'dos' : d === 'bas' ? 'face' : d === 'gauche' ? 'gauche' : 'cote';
  const vc = vueDe(o.dirCorps || 'bas'), vt = vueDe(o.dirTete || o.dirCorps || 'bas');
  const f = o.frame || 0; const bob = (f % 2 === 1) ? -1 : 0;
  const corps = S.corps[vc][f], tete = S.tetes[vt][o.etatTete || 'normal'];
  const X = Math.round(x), Y = Math.round(y);
  // accessoire de dos : derrière le corps sauf vue de dos
  if (S.dosAcc && vc !== 'dos') g.drawImage(S.dosAcc, X - 4 + (vc === 'cote' ? -5 : vc === 'gauche' ? 5 : 5), Y - 16);
  g.drawImage(corps, X - 7, Y - 11 + (o.dy || 0));
  if (S.dosAcc && vc === 'dos') g.drawImage(S.dosAcc, X - 4, Y - 13);
  g.drawImage(tete, X - 13, Y - 32 + bob + (o.etatTete === 'tir' ? 1 : 0) + (o.dy || 0));
}

// ═══════════════════════════════════════════════════════════════════════════
// Génération d'un étage : graphe de salles préparées sur une grille 13×13.
// 1) route praticable par expansion en largeur (pas de boucles) ;
// 2) grandes salles ; 3) culs-de-sac → boss (le plus éloigné), puis salles
// spéciales ; 4) secrets (contraintes topologiques propres) ; 5) validation ;
// 6) secours après un nombre fini d'échecs. Aucune relance infinie.
// ═══════════════════════════════════════════════════════════════════════════

const GRILLE_ETAGE = 13;
const PRIORITE_SPECIALES = ['heritage', 'boutique', 'defi_boss', 'sacrifice', 'malediction', 'defi', 'dispositifs', 'bibliotheque', 'coffres', 'repos'];
const OBLIGATOIRES = ['heritage', 'boutique'];

function planEtage(alea, cfg) {

    }

    const dirs = alea.melanger([[1, 0], [-1, 0], [0, 1], [0, -1]]);
    for (const [x, y] of r.cel) for (const [dx, dy] of dirs) {
      if (salles.length >= N) break;
      const nx = x + dx, ny = y + dy;
      if (!dedans(nx, ny) || occ.has(cle(nx, ny))) continue;
      if (voisinsOcc(nx, ny) > 1) continue;
      if (alea.chance(0.5)) continue;

      let place = null;

  if (!culs.length) return { echec: 'aucun cul-de-sac' };
  const boss = culs[0];
  if (distA[boss.id] < (cfg.distBossMin || 3)) return { echec: 'boss trop proche (' + distA[boss.id] + ')' };
  if (adj[boss.id].has(0)) return { echec: 'boss adjacent au départ' };
  // la salle devant le boss ne doit pas être une grande salle en L (lisibilité de l'approche) — pas d'exigence : documenté
  boss.type = 'boss';
  const restants = culs.slice(1);
  // Salles spéciales demandées pour cet étage
  const demandes = [];
  for (const t of PRIORITE_SPECIALES) {
    const p = (cfg.speciales || {})[t]; if (p === undefined) continue;
    if (p >= 1 || alea.chance(p)) demandes.push(t);
  }
  // les spéciales obligatoires doivent tenir
  const oblig = demandes.filter(t => OBLIGATOIRES.includes(t));
  if (restants.length < oblig.length) return { echec: 'culs-de-sac insuffisants pour ' + oblig.join(', ') };
  alea.melanger(restants);
  // éviter qu'une spéciale soit voisine du boss si possible
  restants.sort((a, b) => (adj[a.id].has(boss.id) ? 1 : 0) - (adj[b.id].has(boss.id) ? 1 : 0));
  for (const t of demandes) { const s = restants.shift(); if (!s) break; s.type = t; }
  // Cache de renseignements (secret) : case vide voisine d'au moins 2 salles ordinaires, loin du boss
  const vides = [];
  for (let y = 0; y < GRILLE_ETAGE; y++) for (let x = 0; x < GRILLE_ETAGE; x++) if (!occ.has(cle(x, y))) vides.push([x, y]);
  const voisinsDe = (x, y) => { const v = new Set(); for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { const k = cle(x + dx, y + dy); if (occ.has(k)) v.add(occ.get(k)); } return [...v]; };
  const candSecret = vides.map(([x, y]) => ({ x, y, v: voisinsDe(x, y) }))
    .filter(c => c.v.length >= 2 && !c.v.some(i => salles[i].type === 'boss') && c.v.every(i => ['combat', 'depart'].includes(salles[i].type) || alea.chance(0.2)));
  let secret = null;
  if (candSecret.length) {
    const maxV = Math.max(...candSecret.map(c => c.v.length));
    const meilleurs = candSecret.filter(c => c.v.length >= Math.min(3, maxV));
    const c = alea.choix(meilleurs);
    secret = ajouter('1x1', c.x, c.y, 'cache'); secret.liens = c.v;
  } else if (cfg.secretObligatoire) return { echec: 'aucun emplacement de cache' };
  // Chambre isolée (super-secrète) : voisine d'exactement une salle ordinaire, et de rien d'autre
  const candIsole = [];
  for (let y = 0; y < GRILLE_ETAGE; y++) for (let x = 0; x < GRILLE_ETAGE; x++) {
    if (occ.has(cle(x, y))) continue; const v = voisinsDe(x, y);
    if (v.length === 1 && salles[v[0]].type === 'combat' && salles[v[0]].forme === '1x1') candIsole.push({ x, y, v });
  }
  let isolee = null;
  if (candIsole.length) {
    // préférer les plus éloignées du départ
    candIsole.sort((a, b) => distA[b.v[0]] - distA[a.v[0]]);
    const c = alea.choix(candIsole.slice(0, Math.max(1, Math.ceil(candIsole.length / 2))));
    isolee = ajouter('1x1', c.x, c.y, 'isolee'); isolee.liens = c.v;

  for (const t of oblig) if (!salles.some(s => s.type === t)) return { echec: 'spéciale manquante : ' + t };

}

// Plan de secours : croix fixe, toujours valide (utilisé après 60 échecs)
function planSecours(cfg) {
  const salles = []; const occ = new Map();
  const add = (x, y, type) => { const id = salles.length; salles.push({ id, forme: '1x1', cx: x, cy: y, cel: [[x, y]], type }); occ.set(x + ',' + y, id); return id; };
  add(6, 6, 'depart'); add(5, 6, 'combat'); add(4, 6, 'heritage'); add(7, 6, 'combat'); add(8, 6, 'combat'); add(9, 6, 'boss');
  add(6, 5, 'combat'); add(6, 4, 'boutique'); add(6, 7, 'combat'); add(6, 8, 'combat');
  const sec = add(7, 5, 'cache'); salles[sec].liens = [3, 6];
  const adj = salles.map(() => new Set());
  for (const s of salles) for (const [x, y] of s.cel) for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { const k = (x + dx) + ',' + (y + dy); if (occ.has(k) && occ.get(k) !== s.id) adj[s.id].add(occ.get(k)); }
  return { salles, occ, adj, distA: [], boss: 5, secret: sec, isolee: null, secours: true };
}

// Type de porte : la salle la plus « spéciale » des deux impose le cadre
const RANG_PORTE = { boss: 9, heritage: 8, boutique: 7, defi_boss: 7, defi: 6, malediction: 6, sacrifice: 5, bibliotheque: 5, dispositifs: 5, coffres: 5, repos: 5, cache: 4, isolee: 4, depart: 0, combat: 0 };
function typePorte(a, b) { const ra = RANG_PORTE[a.type] || 0, rb = RANG_PORTE[b.type] || 0; return ra >= rb ? a.type : b.type; }

// Construit l'étage complet (salles instanciées, portes, gabarits, ennemis)
function genererEtage(partie, numero, cfg) {
  const code = partie.code;
  const topo = fluxEtage(code, numero, 'topologie');
  let plan = null; const diagnostics = [];
  for (let essai = 0; essai < 60 && !plan; essai++) {
    const p = planEtage(topo, cfg);
    if (p.echec) diagnostics.push(p.echec); else plan = p;
  }
  if (!plan) { plan = planSecours(cfg); diagnostics.push('SECOURS'); }
  const E = { numero, cfg, theme: cfg.theme, variante: cfg.variante, nom: cfg.nom, salles: {}, grille: {}, depart: 0, boss: plan.boss,
    secret: plan.secret, isolee: plan.isolee, diagnostics, essais: diagnostics.length + 1, courante: 0, malediction: cfg.malediction || null };
  const alSalles = fluxEtage(code, numero, 'gabarits');
  for (const ps of plan.salles) {
    const s = creerSalle({ id: ps.id, type: ps.type, forme: ps.forme, cx: ps.cx, cy: ps.cy, graine: hacher(code + '|' + numero + '|' + ps.id)[0] });
    E.salles[ps.id] = s;
    for (const [x, y] of ps.cel) E.grille[x + ',' + y] = ps.id;
  }
  // Portes (paires) — les secrets n'ont que des portes secrètes
  for (const ps of plan.salles) {
    const s = E.salles[ps.id];
    for (const [x, y] of ps.cel) for (const d of DIR_LISTE) {
      const [dx, dy] = DIRS[d]; const k = (x + dx) + ',' + (y + dy);
      if (!(k in E.grille)) continue; const autre = E.salles[E.grille[k]]; if (autre.id === s.id) continue;
      const estSecret = s.type === 'cache' || s.type === 'isolee' || autre.type === 'cache' || autre.type === 'isolee';
      if (estSecret) {
        const sec = s.type === 'cache' || s.type === 'isolee' ? ps : plan.salles[autre.id];
        if (!(sec.liens || []).includes(s.type === 'cache' || s.type === 'isolee' ? autre.id : s.id)) continue;
      } else if (!plan.adj[s.id].has(autre.id)) continue;

      const type = estSecret ? (s.type === 'isolee' || autre.type === 'isolee' ? 'isolee' : 'cache') : typePorte(s, autre);
      let etat = 'ouverte';
      if (estSecret) etat = (s.type === 'cache' || s.type === 'isolee') ? 'ouverte' : 'secrete';
      else if ((autre.type === 'heritage' || autre.type === 'boutique' || autre.type === 'bibliotheque' || autre.type === 'coffres' || autre.type === 'repos') && numero >= (cfg.verrouDes || 2)) etat = 'verrouillee';
      else if (autre.type === 'malediction' || s.type === 'malediction') etat = 'ouverte';
      else if (autre.type === 'defi' || autre.type === 'defi_boss') etat = 'conditionnelle';
      else if (autre.type === 'dispositifs' && numero >= 2) etat = 'ouverte';
      ajouterPorte(s, i, j, d, autre.id, type, etat);

  for (const s of Object.values(E.salles)) choisirGabarit(E, s, alSalles, cfg);
  return E;
}

// Choix d'un gabarit compatible (type, forme, portes), sans répétition inutile dans l'étage
function choisirGabarit(E, s, alea, cfg) {
  const dirsPortes = new Set(s.portes.map(p => p.dir + (s.forme === '1x1' ? '' : ':' + p.i + ',' + p.j)));
  const typeGab = s.type === 'depart' ? 'depart' : s.type;
  const deja = E._gabUtilises || (E._gabUtilises = new Set());
  let cands = DON.salles.filter(g => g.type === typeGab && (g.forme || '1x1') === s.forme
    && (!g.etages || (E.numero >= g.etages[0] && E.numero <= g.etages[1]))
    && (!g.themes || g.themes.includes(cfg.theme))
    && (!g.portes || [...dirsPortes].every(d => g.portes.includes(d.split(':')[0]))));
  // les couloirs étroits exigent exactement leurs portes
  if (!cands.length) cands = DON.salles.filter(g => g.type === typeGab && (g.forme || '1x1') === s.forme && !g.portes);
  if (!cands.length) cands = DON.salles.filter(g => g.type === 'combat' && (g.forme || '1x1') === s.forme && !g.portes);
  const frais = cands.filter(g => !deja.has(g.id));
  const g = alea.pondere(frais.length ? frais : cands, x => (x.poids || 1) * (x.themes ? 2 : 1));
  if (!g) throw new Error('Aucun gabarit pour ' + s.type + ' ' + s.forme);
  deja.add(g.id);

}

// ─── 33_sante.js ───
// ═══════════════════════════════════════════════════════════════════════════
// Santé en demi-unités (registre §R9). Ordre d'affichage :
//   [contenants de vitalité][enveloppes osseuses][réserves de chakra][cicatrices]
// Capacité : 12 emplacements. Une réserve de chakra (2 demis) = 1 emplacement.
// Ordre des pertes (dommage reçu) : réserves de chakra (de droite à gauche),
// puis enveloppes osseuses (vitalité contenue, puis rupture d'une enveloppe vide
// qui absorbe le coup entier), puis sceau vital partiel, puis vitalité (droite).
// ═══════════════════════════════════════════════════════════════════════════

const CAPACITE_SANTE = 12;
function santeInit(o) {
  const S = { cont: [], prot: [], cicatrices: 0, partiel: 0 };
  for (let i = 0; i < (o.vitalite || 0); i++) S.cont.push({ t: 'vit', p: 2 });
  for (let i = 0; i < (o.protection || 0) * 2; i++) S.prot.push('b');
  for (let i = 0; i < (o.instable || 0) * 2; i++) S.prot.push('n');
  for (let i = 0; i < (o.os || 0); i++) S.cont.push({ t: 'os', p: 2 });
  if (o.pleins !== undefined) { let reste = o.pleins; for (const c of S.cont) { c.p = Math.min(2, reste); reste = Math.max(0, reste - 2); } }
  trierConteneurs(S); return S;
}
function trierConteneurs(S) { S.cont.sort((a, b) => (a.t === 'vit' ? 0 : 1) - (b.t === 'vit' ? 0 : 1)); }
const nbVit = S => S.cont.filter(c => c.t === 'vit').length;
const nbOs = S => S.cont.filter(c => c.t === 'os').length;
const rougeTotal = S => S.cont.reduce((a, c) => a + c.p, 0);
const rougeMax = S => S.cont.length * 2;
const santeTotale = S => rougeTotal(S) + S.prot.length + S.partiel;
const emplacements = S => S.cont.length + Math.ceil(S.prot.length / 2) + S.cicatrices;
const placeLibre = S => CAPACITE_SANTE - emplacements(S);

// Soin de vitalité : remplit de gauche à droite (vitalité puis enveloppes). Renvoie l'excédent.
function soignerRouge(S, demis) {
  for (const c of S.cont) { while (demis > 0 && c.p < 2) { c.p++; demis--; } }
  return demis;
}
// Nouveau contenant ; à pleine capacité, il est converti en soin d'un cœur (règle affichée)
function ajouterConteneur(S, n = 1, plein = true) {
  let convertis = 0;
  for (let i = 0; i < n; i++) {
    if (placeLibre(S) > 0) { S.cont.push({ t: 'vit', p: plein ? 2 : 0 }); }
    else convertis++;
  }
  trierConteneurs(S);
  if (convertis) soignerRouge(S, convertis * 2);
  return convertis;
}
function retirerConteneur(S, n = 1) { // destruction permanente (contenants de vitalité d'abord)
  let r = 0;
  for (let i = 0; i < n; i++) {
    let k = -1; for (let j = S.cont.length - 1; j >= 0; j--) if (S.cont[j].t === 'vit') { k = j; break; }
    if (k < 0) break; S.cont.splice(k, 1); r++;
  }
  return r;
}
function ajouterOs(S, n = 1) { let a = 0; for (let i = 0; i < n; i++) if (placeLibre(S) > 0) { S.cont.push({ t: 'os', p: 0 }); a++; } trierConteneurs(S); return a; }
// Réserves de chakra protecteur ('b') ou instable ('n'), en demis ; excédent perdu (renvoyé)
function ajouterProtection(S, demis, type = 'b') {
  let perdus = 0;
  for (let i = 0; i < demis; i++) {
    const ouvert = S.prot.length % 2 === 1; // une réserve à moitié pleine accepte un demi sans emplacement
    if (ouvert || placeLibre(S) > 0) S.prot.push(type); else perdus++;
  }

}
function ajouterCicatrice(S, n = 1) {
  for (let i = 0; i < n; i++) {
    S.cicatrices++;
    while (emplacements(S) > CAPACITE_SANTE) {
      if (S.prot.length) { S.prot.splice(-Math.min(2, S.prot.length)); continue; }
      const vide = S.cont.map((c, j) => [c, j]).reverse().find(([c]) => c.p === 0);
      if (vide) { S.cont.splice(vide[1], 1); continue; }
      if (S.cont.length) { S.cont.pop(); continue; }

    }

}
function retirerCicatrice(S, n = 1) { S.cicatrices = Math.max(0, S.cicatrices - n); }
function ajouterPartiel(S) {
  if (S.partiel) { S.partiel = 0; ajouterConteneur(S, 1, true); return 'contenant'; } // deux sceaux partiels forment un contenant
  S.partiel = 1; return 'partiel';

// Dommage reçu (demis). Renvoie { rompusInstables, perduRouge, perduProt, osBrises, mort }
function subirDemis(S, demis) {
  const res = { rompusInstables: 0, perduRouge: 0, perduProt: 0, osBrises: 0, mort: false };
  let reste = demis;
  while (reste > 0 && S.prot.length) {
    const idx = S.prot.length - 1; const type = S.prot[idx];
    S.prot.pop(); reste--; res.perduProt++;
    if (idx % 2 === 0 && type === 'n') res.rompusInstables++; // une réserve instable entièrement vidée
  }
  // enveloppes osseuses (à droite des vitalités)
  while (reste > 0) {
    const k = (() => { for (let j = S.cont.length - 1; j >= 0; j--) if (S.cont[j].t === 'os') return j; return -1; })();
    if (k < 0) break;
    const os = S.cont[k];
    if (os.p > 0) { const x = Math.min(os.p, reste); os.p -= x; reste -= x; res.perduRouge += x; }
    else { S.cont.splice(k, 1); res.osBrises++; reste = 0; } // l'enveloppe vide se rompt et absorbe le coup
  }
  if (reste > 0 && S.partiel) { S.partiel = 0; reste--; }
  while (reste > 0) {
    let k = -1; for (let j = S.cont.length - 1; j >= 0; j--) if (S.cont[j].p > 0) { k = j; break; }
    if (k < 0) break; S.cont[k].p--; reste--; res.perduRouge++;

// Prix en contenants (pactes). Sans contenant de vitalité : 2 réserves de chakra (4 demis) par contenant.
function prixPacteDetail(S, n) {

  if (vit >= n) return { type: 'contenants', n, mortel: santeApresPrix(S, n, 0) <= 0 };
  if (vit === 0 && S.prot.length >= 4 * n) return { type: 'protection', n: 4 * n, mortel: santeTotale(S) - 4 * n <= 0 };
  if (vit === 0) return { type: 'protection', n: 4 * n, impossible: true, mortel: true };

}
function santeApresPrix(S, n) {
  const copie = JSON.parse(JSON.stringify(S)); retirerConteneur(copie, n); return santeTotale(copie);
}
function payerPacte(S, n) {
  const d = prixPacteDetail(S, n); if (d.impossible) return false;

}
function copieSante(S) { return JSON.parse(JSON.stringify(S)); }

// ─── 34_tir.js ───
// ═══════════════════════════════════════════════════════════════════════════
// Pipeline de tir : source → type de lancement → géométrie → trajectoire →
// collisions → impact → effets secondaires (origine, propriétaire, génération,
// budget de réactivation). Un objet modifie une étape sans réécrire les autres.
// ═══════════════════════════════════════════════════════════════════════════

const BUDGET_CYCLE = 14;   // déclenchements secondaires max par cycle d'attaque
const GEN_MAX = { explosion: 2, chaine: 2, eclat: 1, onde: 2, mine: 1, flamme: 2, flaque: 2 };
let _cycle = 0;

// Durée de charge convertie explicitement par la cadence (registre §R8c)
function tempsCharge(J, base) { return base * (2.5 / Math.max(0.4, J.stats.cadence * J.profil.coefCadence)); }
function delaiTir(J) { return 1 / Math.max(0.4, J.stats.cadence * J.profil.coefCadence); }

function majTirJoueur(J, dt) {
  const P = J.profil, TI = J.tir; TI.cooldown -= dt; TI.salveT -= dt;
  // salves en attente
  while (TI.salveFile.length && TI.salveT <= 0) { const s = TI.salveFile.shift(); emettre(J, s.dir, s.mult, s.cycleId, true); TI.salveT = 0.07; }
  if (J.bloqueTir > 0 || J.etat === 'objet' || J.etat === 'mort') { TI.charge = 0; return; }
  const dir = Entrees.visee.dir; const tenu = !!dir;
  if (tenu) TI.dir = dir;
  const forme = P.forme;
  const reglAuto = (G.reglages && G.reglages.chargeAuto);
  // Formes chargées : orbe (déclenchement à charge suffisante), charge libre, rayon
  if (forme === 'orbe' || forme === 'rayon' || forme === 'charge_libre' || (P.chargeable && ['projectile', 'boomerang', 'bombe', 'laser', 'lame', 'lame_longue'].includes(forme))) {
    const base = forme === 'rayon' ? (P.params.rayon.charge || 1.0) : forme === 'orbe' ? (P.params.orbe.charge || 0.6) : forme === 'charge_libre' ? 0.8 : 0.7;
    const tc = tempsCharge(J, base);
    if (tenu && TI.cooldown <= 0) {
      const av = TI.charge; TI.charge = Math.min(1, TI.charge + dt / tc);
      if (av < 1 && TI.charge >= 1) { Son.jouer('charge_pleine'); Entrees.vibrer('charge'); }
      if (TI.charge >= 1 && reglAuto && forme !== 'charge_libre') { declencherCharge(J, TI.dir, 1); }
    } else if (!tenu && TI.charge > 0) {
      if (forme === 'charge_libre') declencherCharge(J, TI.dir, TI.charge);
      else if (TI.charge >= 1) declencherCharge(J, TI.dir, 1);
      else if (P.chargeable && TI.charge > 0.2) declencherCharge(J, TI.dir, TI.charge); // secondaire : relâché tôt = tir normal
      TI.charge = 0;
    }

  }
  if (forme === 'faisceau') { majFaisceauContinu(J, tenu ? TI.dir : null, dt); return; }
  if (forme === 'frappe') { majFrappeDifferee(J, tenu, dt); return; }
  if (forme === 'controle') { majControle(J, dt); return; }
  if (forme === 'rotation') { majRotation(J, tenu, dt); return; }

function declencherCharge(J, dir, charge) {

  else if (P.forme === 'orbe' || P.forme === 'rayon') mult = 1;
  else mult = lerp(1, 2.5, charge); // tir principal rendu chargeable par une forme secondaire

  cycleAttaque(J, dir, mult, { charge });

// ── Géométrie d'un cycle : directions et décalages ──
function geometrieCycle(J, dir) {
  const P = J.profil; const a = Math.atan2(DIRS[dir][1], DIRS[dir][0]); const n = P.multi;
  const E = [];
  if (n === 1) E.push({ a, lat: 0, coef: 1 });
  else if (n === 2) { E.push({ a: a - 0.035, lat: -5, coef: 1 }); E.push({ a: a + 0.035, lat: 5, coef: 1 }); }
  else { const pas = Math.min(10, 60 / (n - 1)) * Math.PI / 180; for (let i = 0; i < n; i++) E.push({ a: a + (i - (n - 1) / 2) * pas, lat: 0, coef: 1 }); }
  if (P.arriere) E.push({ a: a + Math.PI, lat: 0, coef: P.arriere / P.coefMulti * 0.7 });
  if (P.croix) { const ch = Math.min(0.6, P.croix + 0.05 * J.stats.chance); if (Math.random() < ch) for (const d of [Math.PI / 2, -Math.PI / 2, Math.PI]) E.push({ a: a + d, lat: 0, coef: 1 }); }
  return E;
}

// ── Un cycle d'attaque complet ──
function cycleAttaque(J, dir, mult, o = {}) {
  const P = J.profil; const cycleId = ++_cycle; const budget = { n: BUDGET_CYCLE };

function majEnnemis(dt) {

    if (e.apparition > 0) { e.apparition -= dt; continue; }
    majStatuts(e, dt); if (e.mort) continue;

// ── Déplacement ──
function majDeplacementJoueur(J, dt) {

  if (J.bloqueDeplacement > 0) { J.bloqueDeplacement -= dt; mx = 0; my = 0; }

  J.invuln = J.dureeInvuln || 1.0; J.clignote = 0;
  G.stats.degatsRecus += demis;
  if (res.perduRouge > 0) G.etage.degatsVitalite = true;
  G.etage.degatsSubis = true; if (G.salle.type === 'boss') G.etage.degatsBoss = true;

  for (let i = 0; i < res.rompusInstables; i++) { for (const e of G.ennemis) if (!e.mort && !e.cache) infligerDegats(e, 40, { proprio: 'joueur', type: 'instable' }); G.effets.push({ type: 'onde_noire', x: J.x, y: J.y - 10, r: 400, age: 0, duree: 0.5 }); Son.jouer('explosion'); }
  Son.jouer('degat_joueur'); Entrees.vibrer('degats'); secousse(4, src.x !== undefined ? angleVers(src.x, src.y, J.x, J.y) : null);

  if (J.def.regleCode === 'sceau_centaine' && santeTotale(J.sante) <= 1 && J.sceau > 0) { const k = Math.min(J.sceau, rougeMax(J.sante) - rougeTotal(J.sante)); soignerRouge(J.sante, k); J.sceau -= k; G.effets.push({ type: 'sceau_soin', x: J.x, y: J.y - 16, age: 0, duree: 0.8 }); Son.jouer('coeur'); }

// Objets : statistiques (ordre de ramassage sans effet), profil d'attaque,
// inventaire (passifs illimités, 1 actif, 1 talisman, 1 poche par défaut),
// pools pondérés avec déplétion à l'apparition, relances, transformations.

// ── Formule des statistiques (registre §R8) ──
// valeur = (base + Σ ajouts) × (1 + Σ pourcentages/100) × Π multiplicateurs, puis bornes.
const BORNES_STATS = {
  degats: [0.5, 999], cadence: [0.4, 5.0], portee: [2, 16], vitesseTir: [4, 18], vitesse: [2.5, 7.0], chance: [-10, 20],
};
function modificateursStats(J) {
  const M = {}; const add = (s, k, v) => { M[s] = M[s] || { a: 0, p: 0, m: 1 }; if (k === 'm') M[s].m *= v; else M[s][k] += v; };
  const appliquer = e => { if (e.s) { if (e.a) add(e.s, 'a', e.a); if (e.p) add(e.s, 'p', e.p); if (e.m) add(e.s, 'm', e.m); } };
  for (const id of J.passifs) { const d = INDEX[id]; if (d && d.effets) d.effets.forEach(appliquer); }
  if (J.talisman && INDEX[J.talisman]) (INDEX[J.talisman].effets || []).forEach(appliquer);
  for (const t of J.transformations) (INDEX[t].effets || []).forEach(appliquer);
  for (const sy of synergiesActives(J)) (sy.effets || []).forEach(appliquer);
  for (const b of J.bonus) appliquer(b);                // bonus temporaires (salle, secondes, étage)
  for (const b of J.bonusPermanents) appliquer(b);      // pilules, sacrifices, pactes spéciaux
  return M;
}
function calculerStats(J) {
  const base = J.def.stats; const M = modificateursStats(J);
  const S = {};
  for (const k of Object.keys(BORNES_STATS)) {
    const m = M[k] || { a: 0, p: 0, m: 1 };
    let v = (base[k] + m.a) * (1 + m.p / 100) * m.m;
    let [mi, ma] = BORNES_STATS[k];
    if (k === 'cadence') ma += ((M.plafondCadence || {}).a || 0);
    S[k] = borne(v, mi, ma);
  }
  if (J.drapeaux.obstination) S.degats += 1;
  if (J._plein && J.drapeaux.pleineVitalite) S.degats += 0.5;
  if (J.sage && J.drapeaux.energieNaturelle) S.degats *= J.drapeaux.sageFort ? 1.6 : 1.5;
  S.degats = Math.round(S.degats * 100) / 100;
  return S;
}

// ── Profil d'attaque : forme principale par priorité + contributions secondaires ──
// Priorité (la plus haute devient le tir principal) — registre §R17.
const PRIORITE_FORMES = ['frappe', 'controle', 'rayon', 'faisceau', 'orbe', 'charge_libre', 'lame_longue', 'lame', 'bombe', 'boomerang', 'laser', 'rotation', 'projectile'];
// Coefficient par émission selon le nombre total d'émissions (multitir)
const COEF_MULTI = [1, 1, 0.7, 0.58, 0.5, 0.45, 0.42, 0.4, 0.38];
function coefMulti(n) { return COEF_MULTI[Math.min(8, n)] || 0.38; }

function calculerProfil(J) {
  const P = {
    forme: J.def.tir.forme || 'projectile', formes: new Set(), params: {}, multi: J.def.tir.multi || 1, coefCadence: 1,
    arriere: 0, croix: 0, salve: 0, traj: {}, impacts: [], statuts: [], taille: 1, recul: 1, coefDegats: 1,
    apparence: J.def.tir.apparence || 'kunai', elements: new Set(), source: J.def.tir.source || null, differe: !!J.def.tir.differe,
    chargeable: false, spectral: false, perce: 0, rebonds: 0,
  };
  P.formes.add(P.forme);
  if (P.forme === 'charge_libre') P.params.charge_libre = { charge: 0.8, min: 0.5, max: 3 };
  if (P.forme === 'lame') P.params.lame = { portee: J.def.stats.portee, arc: 100, coef: 1, duree: 0.1 };
  const tous = [];
  for (const id of J.passifs) { const d = INDEX[id]; if (d && d.effets) for (const e of d.effets) tous.push([e, d]); }
  for (const t of J.transformations) for (const e of (INDEX[t].effets || [])) tous.push([e, INDEX[t]]);
  if (J.talisman && INDEX[J.talisman]) for (const e of (INDEX[J.talisman].effets || [])) tous.push([e, INDEX[J.talisman]]);
  for (const sy of synergiesActives(J)) for (const e of (sy.effets || [])) tous.push([e, sy]);
  for (const b of J.bonus) if (b.tir) tous.push([b.tir, { id: 'bonus' }]);
  for (const [e, d] of tous) {
    if (e.forme) { P.formes.add(e.forme); P.params[e.forme] = Object.assign({}, P.params[e.forme] || {}, e); }
    if (e.multi) { P.multi += e.multi; if (e.coefCadence) P.coefCadence *= e.coefCadence; }
    if (e.arriere) P.arriere = Math.max(P.arriere, e.arriere);
    if (e.croix) P.croix += e.croix;
    if (e.salve) { P.salve += e.salve; if (e.coefCadence) P.coefCadence *= e.coefCadence; }
    if (e.traj) { P.traj[e.traj] = (P.traj[e.traj] || 0) + (e.force || 1); }
    if (e.impact) P.impacts.push(e);
    if (e.statut) P.statuts.push(e);
    if (e.taille) P.taille *= e.taille;
    if (e.recul) P.recul *= e.recul;
    if (e.coefDegats) P.coefDegats *= e.coefDegats;
    if (e.cadenceTir) P.coefCadence *= e.cadenceTir;
    if (e.element) P.elements.add(e.element);
    if (e.apparence) P.apparence = e.apparence;
  }
  // Forme principale : la plus prioritaire présente
  for (const f of PRIORITE_FORMES) if (P.formes.has(f)) { P.forme = f; break; }
  P.secondaires = [...P.formes].filter(f => f !== P.forme && f !== 'projectile');
  // Contributions secondaires (table §R17b) : chaque forme non principale se convertit
  for (const f of P.secondaires) {
    if (f === 'orbe' || f === 'charge_libre') P.chargeable = true;                // le tir principal se charge
    else if (f === 'rayon') { P.spectral = true; P.perce = 99; P.coefDegats *= 1.3; }
    else if (f === 'laser') P.laserAppoint = true;                                  // un trait d'appoint par cycle (×0,5)
    else if (f === 'faisceau') P.traj.continu = 1;                                 // les impacts laissent un court faisceau
    else if (f === 'boomerang') P.traj.retour = 1;
    else if (f === 'lame' || f === 'lame_longue') P.frappeAppoint = f;              // coup d'appoint devant soi
    else if (f === 'bombe') P.impacts.push({ impact: 'explosion', r: 1.0, coef: 0.5, source: 'bombe' });
    else if (f === 'frappe') P.frappeDifferee = 3;                                 // un cycle sur 3 : frappe au sol
    else if (f === 'controle') P.orbeAppoint = true;                                // une sphère contrôlée d'appoint (×0,5)
    else if (f === 'rotation') P.deviation = true;                                  // dévie les projectiles proches en tirant
  }
  if (P.traj.percant) P.perce = 99;
  if (P.traj.spectral) P.spectral = true;
  if (P.traj.rebond) P.rebonds = 3 * P.traj.rebond;
  // Multitir : coefficient global selon le nombre d'émissions
  P.multi = Math.min(8, P.multi); P.coefMulti = coefMulti(P.multi);
  return P;
}

// ── Inventaire ──
function possede(J, id) { return J.passifs.includes(id); }
function nbCopies(J, id) { return J.passifs.filter(x => x === id).length; }
function recalculer(J) {
  // drapeaux : ceux du personnage, puis ceux des objets, talismans et transformations
  const obst = J.drapeaux && J.drapeaux.obstination;
  J.drapeaux = Object.assign({}, J.drapeauxBase || {}); if (obst) J.drapeaux.obstination = true;
  const sources = J.passifs.map(id => INDEX[id]).concat(J.transformations.map(t => INDEX[t]), J.talisman ? [INDEX[J.talisman]] : [], J.talisman2 ? [INDEX[J.talisman2]] : [], synergiesActives(J));
  for (const d of sources) for (const e of (d && d.effets) || []) if (e.drapeau) J.drapeaux[e.drapeau] = e.valeur === undefined ? true : e.valeur;
  J.maxPoches = 1 + (J.drapeaux.pocheDouble ? 1 : 0); J.maxTalismans = 1 + (J.drapeaux.talismanDouble ? 1 : 0);
  J.stats = calculerStats(J); J.profil = calculerProfil(J);
  J.vol = J.passifs.some(id => (INDEX[id].effets || []).some(e => e.vol)) || J.transformations.some(t => (INDEX[t].effets || []).some(e => e.vol)) || J.bonus.some(b => b.vol);
  majMutations(J);
}
// Acquisition d'un passif (règles de doublons : cumul / conversion / unique)
function acquerirPassif(J, id, source = 'piedestal') {
  const d = INDEX[id]; if (!d) return;
  if (d.cumul === 'conversion' && possede(J, id)) { appliquerConversion(J, d); evenement('objet_acquis', { id, doublon: true }); return; }
  J.passifs.push(id);
  const premiere = !J.acquis.includes(id);
  if (premiere) J.acquis.push(id);
  for (const e of d.effets || []) appliquerEffetImmediat(J, e, d);
  if (premiere && d.ensemble) verifierTransformations(J);
  recalculer(J);
  if (G.etage && (d.effets || []).some(e => e.drapeau === 'plan' || e.drapeau === 'boussole' || e.drapeau === 'byakugan')) revelerPlan(J);
  evenement('objet_acquis', { id, source });
  Progression.decouvrir(id);
}
function appliquerConversion(J, d) { // doublon converti : effet documenté dans d.conversion
  const c = d.conversion || { res: { ryo: 5 } };
  appliquerEffetImmediat(J, c, d);
}
function retirerPassif(J, id) {
  const k = J.passifs.lastIndexOf(id); if (k < 0) return false;
  J.passifs.splice(k, 1); recalculer(J); evenement('objet_retire', { id }); return true;
}
// Effets à l'acquisition : santé, ressources, familiers
function appliquerEffetImmediat(J, e, d) {
  const S = J.sante;
  if (e.sante) {
    const s = e.sante;
    if (s.cont) { if (J.drapeaux.sansVitalite) ajouterProtection(S, 2 * s.cont); else if (J.drapeaux.plafondVit && nbVit(S) >= J.drapeaux.plafondVit) soignerRouge(S, 2 * s.cont); else ajouterConteneur(S, s.cont, s.plein !== false); }
    if (s.soin) soignerJoueur(J, s.soin);
    if (s.soinTotal) soignerJoueur(J, 24);
    if (s.prot) ajouterProtection(S, s.prot, 'b');
    if (s.instable) ajouterProtection(S, s.instable, 'n');
    if (s.os) ajouterOs(S, s.os);
    if (s.partiel) ajouterPartiel(S);
    if (s.cicatrice) ajouterCicatrice(S, s.cicatrice);
    if (s.retraitCont) retirerConteneur(S, s.retraitCont);
  }
  if (e.res) { for (const [k, v] of Object.entries(e.res)) ajouterRessource(J, k, v); }
  if (e.familier) ajouterFamilier(J, e.familier, d.id);
  if (e.consommable) donnerConsommable(J, e.consommable);
}
function soignerJoueur(J, demis) {
  if (J.drapeaux.sansVitalite) return 0;
  const exces = soignerRouge(J.sante, demis);
  if (exces > 0) evenement('soin_excedentaire', { demis: exces });
  return demis - exces;
}
const PLAFONDS_RESSOURCES = { ryo: 99, cles: 99, explosifs: 99 };
function ajouterRessource(J, k, v) {
  J[k] = borne((J[k] || 0) + v, 0, PLAFONDS_RESSOURCES[k] || 99);

// ── Transformations (résonances de chakra) ──
// Compte : identifiants distincts acquis au moins une fois pendant la partie (historique),
// actifs compris ; un même identifiant ne compte qu'une fois, même repris sur un piédestal.
function verifierTransformations(J) {
  for (const t of DON.transformations) {
    if (J.transformations.includes(t.id)) continue;
    const n = J.acquis.filter(id => INDEX[id] && INDEX[id].ensemble === t.ensemble).length;
    if (n >= (t.seuil || 3)) {
      J.transformations.push(t.id);
      for (const e of t.effets || []) appliquerEffetImmediat(J, e, t);
      recalculer(J);
      annoncerTransformation(t);
      evenement('transformation', { id: t.id });
      Progression.decouvrir(t.id);
    }
  }
}

// ── Mutations visuelles cumulatives (couches, priorités, fusion) ──
const COUCHES = ['aura', 'dos', 'corps', 'bras', 'peau', 'yeux', 'tete', 'orbitaux'];
function majMutations(J) {
  const m = [];
  const ajouter = (src, v) => { if (v) m.push(Object.assign({ src, prio: v.prio || 1 }, v)); };
  for (const id of J.passifs) ajouter(id, INDEX[id].visuel);
  for (const t of J.transformations) ajouter(t, Object.assign({ prio: 10 }, INDEX[t].visuel));
  // une couche = une mutation visible (priorité la plus haute) ; les autres restent consultables
  const parCouche = {};
  for (const v of m) { if (!v.couche) continue; const c = parCouche[v.couche]; if (!c || v.prio > c.prio) parCouche[v.couche] = v; }
  J.mutations = parCouche; J.mutationsToutes = m;

// ── Pools : sélection pondérée, filtres, déplétion à l'apparition ──
// Un objet « généré » (posé sur un piédestal) est retiré de tous les pools de la partie.
function objetsDuPool(pool) { return DON.objets.filter(o => o.pools && o.pools[pool] > 0); }
function tirerObjet(partie, pool, alea, options = {}) {
  const J = partie.joueur;
  const filtre = o => {
    if (partie.retires.includes(o.id)) return false;
    if (!Progression.estDebloque(o.id)) return false;
    if (o.persoExclusif && o.persoExclusif !== J.def.id && o.persoExclusif !== J.def.parent) return false;
    if (o.exclusion && o.exclusion.some(x => J.drapeaux[x])) return false;           // objet réellement sans fonction
    if (o.type === 'actif' && options.passifSeulement) return false;
    if (options.qualiteMin !== undefined && (o.qualite || 0) < options.qualiteMin) return false;
    if (options.qualiteMax !== undefined && (o.qualite || 0) > options.qualiteMax) return false;
    return true;
  };
  let cands = objetsDuPool(pool).filter(filtre);
  if (!cands.length && pool !== 'heritage') cands = objetsDuPool('heritage').filter(filtre); // épuisement : repli sur l'héritage
  if (!cands.length) return 'PSV_083';                                                     // repli final : Bol de ramen
  const o = alea.pondere(cands, x => x.pools[pool] || x.pools.heritage || 1);
  if (!o) return 'PSV_083';
  partie.retires.push(o.id);
  return o.id;
}

// Exploration : plan (salles), boussole (icônes spéciales), Byakugan (tout, secrets compris)
function revelerPlan(J) {
  for (const s of Object.values(G.etage.salles)) {
    if (s.id === 'opp') continue;
    const secret = s.type === 'cache' || s.type === 'isolee';
    if (J.drapeaux.byakugan) s.apercue = true;
    else if (J.drapeaux.plan && !secret) s.apercue = true;
    else if (J.drapeaux.boussole && !secret && s.type !== 'combat') s.apercue = true;
  }
}

// Composition de l'étage n : position, thème (graine), variante, boss

  const theme = al.choix(themes);

// ── Entrée dans une salle ──
function entrerSalle(id, depuisDir) {

  G.appat = null; G.pousse = null; G.gelGlobal = 0;

// ── Opportunité après le boss : table de décision (registre §R23) ──
function chanceOpportunite() {
  const E = G.etage, P = G.partie, J = G.joueur;
  if (E.numero < 2 || E.numero > 8) return { chance: 0, pacte: 0, sanctuaire: 0, detail: [] };
  const det = []; let c = 0.20; det.push(['Base', 0.20]);
  if (!E.degatsVitalite) { c += 0.15; det.push(['Aucun dégât à la vitalité sur l’étage', 0.15]); }
  if (!E.degatsBoss) { c += 0.10; det.push(['Boss vaincu sans être touché', 0.10]); }
  if (J.talisman === 'TAL_015') { c += 0.05; det.push(['Bague de l’Akatsuki', 0.05]); }
  if (possede(J, 'PSV_091')) { c += 0.20; det.push(['Sceau maudit', 0.20]); }
  if (E.faveurSanctuaire) { c += E.faveurSanctuaire; det.push(['Faveur de l’autel', E.faveurSanctuaire]); }
  c = borne(c, 0, 0.95);
  if (J.drapeaux.serment) return { chance: 1, pacte: 1, sanctuaire: 0, detail: [['Serment de vengeance', 1]] };
  let wP = 0.6, wS = 0.4 + 0.25 * P.pactesRefuses + (J.talisman === 'TAL_004' ? 0.15 : 0);
  if (P.pactesAchetes > 0) wS = 0;  // exclusion puis renormalisation : toute l'opportunité devient un pacte
  const tot = wP + wS;
  return { chance: c, pacte: c * wP / tot, sanctuaire: c * wS / tot, detail: det };

}

function prendrePilule(J, c) {

// chasseur, collecteur, soutien, bloqueur, kamikaze, piégeur, marionnette.
// Ils ne bloquent pas les portes, ne poussent pas le joueur, se replacent à
// l'entrée de salle ; une copie n'hérite jamais d'une autre copie.

function ajouterFamilier(J, id, source) {
  const d = DON.familiers.find(f => f.id === id); if (!d) return null;
  const f = { def: d, x: J.x, y: J.y, vx: 0, vy: 0, t: Math.random(), cd: 0, source, uid: Math.random().toString(36).slice(2), angle: Math.random() * Math.PI * 2 };
  f.bloque = !!d.bloque; f.rBloc = d.rBloc || 7; f.collecte = d.comportement === 'collecteur';
  if (d.comportement === 'clone_temp') { f.dureeSalle = true; }
  J.familiers.push(f);
  return f;
}
// Multiplicateur de dégâts d'un familier : talisman, « familiers forts » (Chakra partagé, Meute),
// marionnettes renforcées (Arsenal), Gamakichi à l'arrêt avec la Nature du sage (Sage des crapauds).
function bonusFamilier(J, f) {
  let k = (J.talisman === 'TAL_020' || J.talisman2 === 'TAL_020' ? 1.2 : 1) * (J.drapeaux.familiersForts ? 1.25 : 1);
  if (J.drapeaux.marionnettesFortes && f.def.marionnette) k *= 1.5;
  if (J.sage && f.def.id === 'FAM_GAMAKICHI' && synergiesActives(J).some(x => x.id === 'SYN_052')) k *= 1.5;
  return k;
}
function retirerFamiliersSalle(J) { J.familiers = J.familiers.filter(f => !f.dureeSalle && !(f.etage && G.etage && f.etage !== G.etage.numero)); }

function majFamiliers(J, dt) {
  const suiveurs = J.familiers.filter(f => ['suiveur_tireur', 'copieur', 'soutien', 'collecteur_suiveur', 'pakkun', 'luciole', 'clone_temp', 'clone_res'].includes(f.def.comportement));
  const orbitaux = J.familiers.filter(f => f.def.comportement === 'orbital');
  const dir = Entrees.visee.dir;

  let prec = { x: J.x, y: J.y };
  for (const f of suiveurs) {
    const d = dist(f.x, f.y, prec.x, prec.y);
    if (d > 16) { const k = Math.min(1, (d - 16) / d * 10 * dt); f.x += (prec.x - f.x) * k; f.y += (prec.y - f.y) * k; }
    prec = f;
  }
  let io = 0;

    const D = f.def; f.t += dt; f.cd -= dt; const bonusFam = bonusFamilier(J, f);

      case 'suiveur_tireur': case 'clone_res':
        if (dir && f.cd <= 0) { f.cd = 1 / (D.cadence || 1.8); const a = Math.atan2(DIRS[dir][1], DIRS[dir][0]);
          const deg = (D.coefJoueur ? J.stats.degats * D.coefJoueur : (D.degats || 3.5)) * bonusFam;
          const p = tirFamilier(f, a, deg, D); if (D.statut) p.statuts = [{ statut: D.statut, chance: D.chanceStatut || 0.3 }]; }
        break;
      case 'copieur': case 'clone_temp':
        if (dir && f.cd <= 0) { f.cd = delaiTir(J); const a = Math.atan2(DIRS[dir][1], DIRS[dir][0]);
          const p = tirFamilier(f, a, J.stats.degats * (D.coef || 0.75) * bonusFam, D); p.impacts = J.profil.impacts.slice(); p.statuts = J.profil.statuts.slice(); p.traj = Object.assign({}, J.profil.traj); p.perce = J.profil.perce; p.spectral = J.profil.spectral; p.apparence = J.profil.apparence; p.gen = 1; }
        if (D.comportement === 'clone_temp') { // disparaît au premier coup reçu
          for (const p of G.proj) if (p.proprio === 'ennemi' && dist(p.x, p.y, f.x, f.y - 8) < 9) { detruireProjectile(p, 'bloque'); f.fini = true; }
          for (const e of G.ennemis) if (!e.mort && !e.cache && dist(e.x, e.y, f.x, f.y) < e.r + 6) f.fini = true;
          if (f.fini) { G.effets.push({ type: 'fumee', x: f.x, y: f.y - 8, age: 0, duree: 0.4 }); Son.jouer('fumee', 0.5); }

        const r = (D.rayon || 1.3) * TUILE; f.x = J.x + Math.cos(f.angle) * r; f.y = J.y - 8 + Math.sin(f.angle) * r * 0.8;
        if (D.degats) for (const e of G.ennemis) if (!e.mort && !e.cache && dist(e.x, e.y - 8, f.x, f.y) < e.r + 6) { if (!f.touches) f.touches = new Map(); const t = f.touches.get(e.uid) || 0; if (G.temps - t > 0.3) { f.touches.set(e.uid, G.temps); infligerDegats(e, D.degats * bonusFam, { proprio: 'familier', type: 'orbital', x: e.x, y: e.y, vx: e.x - J.x, vy: e.y - J.y, recul: 20 }); } }
        break;
      }
      case 'contact': { // charge dans la direction de tir, revient
        if (f.charge) {
          f.charge.t += dt; f.x += f.charge.dx * 260 * dt; f.y += f.charge.dy * 260 * dt;
          for (const e of G.ennemis) if (!e.mort && !e.cache && !f.charge.touches.has(e) && dist(e.x, e.y, f.x, f.y) < e.r + 8) { f.charge.touches.add(e); infligerDegats(e, (D.degats || 6) + J.stats.degats * (D.coefJoueur || 0) * bonusFam, { proprio: 'familier', type: 'contact', x: e.x, y: e.y, vx: f.charge.dx, vy: f.charge.dy, recul: 50 }); }
          const t = tuilePx(G.salle, f.x, f.y); if (f.charge.t > 0.5 || PROP[t].mur) f.charge = null;
        } else {
          const d = dist(f.x, f.y, J.x + 12, J.y + 6); if (d > 4) { f.x += (J.x + 12 - f.x) * 6 * dt; f.y += (J.y + 6 - f.y) * 6 * dt; }
          if (dir && f.cd <= 0) { f.cd = D.recharge || 1.2; f.charge = { dx: DIRS[dir][0], dy: DIRS[dir][1], t: 0, touches: new Set() }; Son.jouer('vent', 0.4); }

        f.vx = lerp(f.vx, dx * (D.vitesse || 3) * TUILE, 4 * dt); f.vy = lerp(f.vy, dy * (D.vitesse || 3) * TUILE, 4 * dt); f.x += f.vx * dt; f.y += f.vy * dt;
        if (c && dist(c.x, c.y, f.x, f.y) < c.r + 8 && f.cd <= 0) { f.cd = D.cadence ? 1 / D.cadence : 0.6; infligerDegats(c, (D.degats || 4) * bonusFam, { proprio: 'familier', type: 'morsure', x: c.x, y: c.y, vx: dx, vy: dy, recul: 30 }); if (D.statut) appliquerStatut(c, D.statut, 1.5, D.degats); }
        break;
      }
      case 'collecteur': {
        const r = G.salle.ramassables.filter(x => ['ryo', 'cle', 'explosif'].includes(RAMASSABLES[x.type].cat) && x.age > 0.3).sort((a, b) => dist(a.x, a.y, f.x, f.y) - dist(b.x, b.y, f.x, f.y))[0];
        const cx = r ? r.x : J.x - 14, cy = r ? r.y : J.y; const [dx, dy] = normaliser(cx - f.x, cy - f.y);
        f.x += dx * 100 * dt; f.y += dy * 100 * dt;
        if (D.degats) for (const e of G.ennemis) if (!e.mort && !e.cache && dist(e.x, e.y, f.x, f.y) < e.r + 6 && f.cd <= 0) { f.cd = 0.25; infligerDegats(e, D.degats * bonusFam, { proprio: 'familier', type: 'essaim', sansRecul: true }); }
        break;
      }
      case 'bloqueur': { // se place entre le joueur et l'ennemi le plus menaçant
        const c = ennemiLePlusProche(J.x, J.y, 9999); const a = c ? angleVers(J.x, J.y, c.x, c.y) : Math.atan2(-DIRS[J.dirTete][1], -DIRS[J.dirTete][0]);
        const tx = J.x + Math.cos(a) * 22, ty = J.y - 6 + Math.sin(a) * 18; f.x = lerp(f.x, tx, 10 * dt); f.y = lerp(f.y, ty, 10 * dt); break;
      }
      case 'kamikaze': {
        if (f.plonge) { const c = f.plonge; if (c.mort) { f.plonge = null; break; } const [dx, dy] = normaliser(c.x - f.x, c.y - 8 - f.y); f.x += dx * 300 * dt; f.y += dy * 300 * dt; if (dist(f.x, f.y, c.x, c.y - 8) < 10) { explosion(f.x, f.y, 1.2 * TUILE, J.stats.degats * 3 * bonusFam, { proprio: 'joueur', petite: false, blesseJoueur: false, decor: false }); f.plonge = null; f.cd = (D.recharge || 4) * (J.drapeaux.oiseauRapide ? 0.5 : 1); f.x = J.x; f.y = J.y - 20; } }
        else { f.x = lerp(f.x, J.x - 10, 5 * dt); f.y = lerp(f.y, J.y - 26, 5 * dt); if (f.cd <= 0) { const c = ennemiLePlusProche(f.x, f.y, 9999); if (c) f.plonge = c; } }
        break;
      }

        if (f.cd <= 0) { const c = ennemiLePlusProche(f.x, f.y, 9999, e => !e.boss); if (c) { f.cd = D.recharge || 8; appliquerStatut(c, 'immobilise', 3, 0); G.effets.push({ type: 'kuroari', cible: c, x: c.x, y: c.y, age: 0, duree: 3 }); setTimeoutJeu(() => !c.mort && infligerDegats(c, J.stats.degats * 4 * bonusFam, { proprio: 'familier', type: 'piege' }), 2.9); } else f.cd = 1; }
        break;

        else { f.x = lerp(f.x, J.x + 12, 4 * dt); f.y = lerp(f.y, J.y - 30, 4 * dt); if (f.cd <= 0) f.vise = ennemiLePlusProche(f.x, f.y, 9999); }

function portesReliees(s) {

    if (s.tuiles[ty * s.W + tx] !== T.SOL) continue;
    if (s.portes.some(p => Math.abs(p.tx - tx) + Math.abs(p.ty - ty) <= marge + 1)) continue;
    if ((s.pointsApparition || []).some(q => q.tx === tx && q.ty === ty) || (s.pointsSpeciaux || []).some(q => q.tx === tx && q.ty === ty)) continue;

// ── Minicarte et carte étendue ──
const ICONE_SALLE = { boss: '#e04a4a', heritage: '#f0c040', boutique: '#e0d070', cache: '#a090a0', isolee: '#a090a0', sacrifice: '#c07070', malediction: '#b04070', defi: '#9090c0', defi_boss: '#c060a0', dispositifs: '#50a0c0', bibliotheque: '#80c060', coffres: '#c0a050', repos: '#60c0c0', pacte: '#8a3aa8', sanctuaire: '#f0f0d0' };
function dessinerMinicarte(g, x0, y0, etendue) {
  const E = G.etage; if (!E) return; const s0 = G.salle;
  const perdu = G.etage.malediction === 'perdu' && !etendue;
  const cw = etendue ? 18 : 9, ch = etendue ? 14 : 7, n = etendue ? 13 : 7;
  const cx = s0.cx >= 0 ? s0.cx : 6, cy = s0.cy >= 0 ? s0.cy : 6;
  const ox = etendue ? Math.round(320 - 6.5 * cw) : x0, oy = etendue ? Math.round(180 - 6.5 * ch) : y0;
  const dx0 = etendue ? 0 : cx - 3, dy0 = etendue ? 0 : cy - 3;
  if (!etendue) { g.fillStyle = 'rgba(10,8,14,0.55)'; g.fillRect(ox - 2, oy - 2, n * cw + 4, n * ch + 4); }
  if (perdu) { Police.ecrire(g, '?', ox + n * cw / 2, oy + n * ch / 2 - 4, '#8a8098', { a: 'c' }); return; }
  for (const s of Object.values(E.salles)) {
    if (s.id === 'opp' || !(s.visitee || s.apercue)) continue;
    const F = FORMES[s.forme];
    for (const [i, j] of F.cel) {
      const gx = s.cx + i - dx0, gy = s.cy + j - dy0; if (gx < 0 || gy < 0 || gx >= n || gy >= n) continue;
      const x = ox + gx * cw, y = oy + gy * ch;
      g.fillStyle = s === s0 ? '#f0e8f8' : s.visitee ? '#8a8098' : '#4a4258'; g.fillRect(x, y, cw - 1, ch - 1);
      // fusion visuelle des cellules d'une grande salle
      if (F.cel.some(([a, b]) => a === i + 1 && b === j)) g.fillRect(x + cw - 1, y, 1, ch - 1);
      if (F.cel.some(([a, b]) => a === i && b === j + 1)) g.fillRect(x, y + ch - 1, cw - 1, 1);
    }
    const ic = ICONE_SALLE[s.type];
    if (ic && (s.visitee || s.apercue)) { const gx = s.cx - dx0, gy = s.cy - dy0; if (gx >= 0 && gy >= 0 && gx < n && gy < n) { g.fillStyle = '#14101c'; g.fillRect(ox + gx * cw + Math.floor(cw / 2) - 2, oy + gy * ch + Math.floor(ch / 2) - 2, 5, 4); g.fillStyle = ic; g.fillRect(ox + gx * cw + Math.floor(cw / 2) - 1, oy + gy * ch + Math.floor(ch / 2) - 1, 3, 2); } }
  }
}
function dessinerCarteEtendue(g) {
  g.fillStyle = 'rgba(6,4,10,0.82)'; g.fillRect(0, 0, ECRAN_L, ECRAN_H);
  dessinerMinicarte(g, 0, 0, true);
  Police.ecrire(g, G.etage.cfg.titre + ' — ' + G.etage.cfg.nom, 320, 16, '#e8dcc0', { a: 'c' });
  Police.ecrire(g, 'Code de mission : ' + codeAffiche(G.partie.code) + '   Temps : ' + formatTemps(G.partie.temps), 320, 340, '#8a8098', { a: 'c' });
  const leg = [['Boss', 'boss'], ['Héritage', 'heritage'], ['Échoppe', 'boutique'], ['Secret', 'cache'], ['Épreuve', 'defi'], ['Maudite', 'malediction']];
  leg.forEach(([t, k], i) => { g.fillStyle = ICONE_SALLE[k]; g.fillRect(30, 60 + i * 14, 6, 6); Police.ecrire(g, t, 40, 60 + i * 14, '#c8c0d8'); });
}

// ── Liste de menu générique ──
function menuListe(items, o = {}) {
  return { items, focus: 0, o,

      const cur = this.items[this.focus];
      if (Entrees.nav.dx && (cur.type === 'curseur' || cur.type === 'choix' || cur.type === 'bascule')) { cur.changer(Entrees.nav.dx); Son.jouer('menu'); }
      if (Entrees.menuConfirmer()) { if (cur.type === 'bascule') { cur.changer(1); Son.jouer('valider'); } else if (cur.action) { Son.jouer('valider'); cur.action(); } }
    },
    rendre(g, x, y, largeur, actif = true) {
      let yy = y;

        if (f) { g.fillStyle = 'rgba(240,200,120,0.14)'; g.fillRect(x - 6, yy - 3, largeur + 12, h); g.fillStyle = '#f0c870'; g.fillRect(x - 6, yy - 3, 2, h); }
        const col = it.inactif ? '#5a5268' : f ? '#fff4d8' : '#c8c0d8';
        Police.ecrire(g, it.label, x, yy, col);
        if (it.valeur) { const v = it.valeur(); Police.ecrire(g, (it.type !== 'bouton' && f ? '< ' : '') + v + (it.type !== 'bouton' && f ? ' >' : ''), x + largeur, yy, f ? '#ffe0a0' : '#a8a0b8', { a: 'd' }); }
        yy += h;

      const cur = this.items[this.focus]; if (cur && cur.aide && actif) Police.paragraphe(g, cur.aide, x, yy + 8, largeur, '#8a8098');
    },
  };
}
function curseur(label, get, set, min, max, pas, fmt) { return { label, type: 'curseur', valeur: () => fmt ? fmt(get()) : Math.round(get() * 100) + ' %', changer: d => { set(arrondi(borne(get() + d * pas, min, max), 3)); } }; }
function bascule(label, get, set, aide) { return { label, type: 'bascule', aide, valeur: () => get() ? 'Oui' : 'Non', changer: () => set(!get()) }; }
function choix(label, options, get, set, aide) { return { label, type: 'choix', aide, valeur: () => (options.find(o => o[0] === get()) || options[0])[1], changer: d => { const i = options.findIndex(o => o[0] === get()); set(options[(i + d + options.length) % options.length][0]); } }; }
function cadreMenu(g, x, y, l, h, titre) {

// ── Saisie d'un code de mission à la manette (grille) ──
const SceneCode = {
  entrer() { this.code = ''; this.x = 0; this.y = 0; this.cols = 8; },
  maj() {

    const k = this.y * this.cols + this.x;
    if (Entrees.menuConfirmer()) {
      if (k < ALPHABET_CODE.length) { if (this.code.length < 8) { this.code += ALPHABET_CODE[k]; Son.jouer('valider'); } }
      else if (k === ALPHABET_CODE.length) { this.code = this.code.slice(0, -1); Son.jouer('annuler'); }

const Stockage = {

    const essayer = s => { try { return s ? JSON.parse(s) : null; } catch (e) { return null; } };
    let v = essayer(brut);
    if (!v) { try { v = essayer(localStorage.getItem(cle + '_tmp')) || essayer(localStorage.getItem(cle + '_bak')); } catch (e) { v = null; } }
