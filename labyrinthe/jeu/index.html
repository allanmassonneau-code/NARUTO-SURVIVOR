// ── Hasard reproductible ─────────────────────────────────────────────────────
// sfc32 : générateur 32 bits à état explicite (4 entiers), sérialisable.
function hacher(chaine) { // cyrb128 → 4 entiers 32 bits
  let h1 = 1779033703, h2 = 3144134277, h3 = 1013904242, h4 = 2773480762;
  for (let i = 0; i < chaine.length; i++) {
    const k = chaine.charCodeAt(i);
    h1 = h2 ^ Math.imul(h1 ^ k, 597399067); h2 = h3 ^ Math.imul(h2 ^ k, 2869860233);
    h3 = h4 ^ Math.imul(h3 ^ k, 951274213); h4 = h1 ^ Math.imul(h4 ^ k, 2716044179);
  }
  h1 = Math.imul(h3 ^ (h1 >>> 18), 597399067); h2 = Math.imul(h4 ^ (h2 >>> 22), 2869860233);
  h3 = Math.imul(h1 ^ (h3 >>> 17), 951274213); h4 = Math.imul(h2 ^ (h4 >>> 19), 2716044179);
  return [(h1 ^ h2 ^ h3 ^ h4) >>> 0, (h2 ^ h1) >>> 0, (h3 ^ h1) >>> 0, (h4 ^ h1) >>> 0];
}
class Alea {
  constructor(graine) { this.s = Array.isArray(graine) ? graine.slice() : hacher(String(graine)); for (let i = 0; i < 12; i++) this.suivant(); }
  suivant() { // [0,1)
    let [a, b, c, d] = this.s;
    a >>>= 0; b >>>= 0; c >>>= 0; d >>>= 0;
    const t = (a + b | 0) + d | 0;
    d = d + 1 | 0; a = b ^ b >>> 9; b = c + (c << 3) | 0; c = c << 21 | c >>> 11; c = c + t | 0;
    this.s = [a, b, c, d];

  entier(n) { return Math.floor(this.suivant() * n); }            // [0, n)
  entre(a, b) { return a + this.suivant() * (b - a); }

  chance(p) { return this.suivant() < p; }

  pondere(liste, poids) {

    for (let i = 0; i < liste.length; i++) { r -= w[i]; if (r < 0 && w[i] > 0) return liste[i]; }
    for (let i = liste.length - 1; i >= 0; i--) if (w[i] > 0) return liste[i];
    return undefined;
  }

// ── Musique : séquenceur à anticipation, couches dynamiques ──
const GAMMES = {
  in: [0, 1, 5, 7, 8],        // miyako-bushi : étrange, tendu
  yo: [0, 2, 5, 7, 9],        // plus ouvert
  ryukyu: [0, 4, 5, 7, 11],
  sombre: [0, 1, 3, 7, 8],
};
const Musique = {
  A: null, piste: null, pas: 0, prochain: 0, minuteur: null, couches: null, combat: 0, cibleCombat: 0,
  init(A) {
    this.A = A;
    const c = A.ctx;
    this.gAmb = c.createGain(); this.gPerc = c.createGain(); this.gAmb.gain.value = 1; this.gPerc.gain.value = 0;
    this.gAmb.connect(A.busMusique); this.gPerc.connect(A.busMusique);
    this.minuteur = setInterval(() => this.planifier(), 25);
  },
  // Une piste est générée de façon déterministe depuis son nom : mélodie originale.
  jouerPiste(nom, opts = {}) {
    if (this.piste && this.piste.nom === nom) return;
    const r = new Alea('musique|' + nom);
    const gamme = GAMMES[opts.gamme || 'in'];
    const racine = opts.racine || 50; // MIDI
    const tempo = opts.tempo || 84;
    const mesures = 8, pasParMesure = 16;
    // motif rythmique et mélodie en marche aléatoire bornée
    const melodie = [];
    let deg = 7;
    for (let m = 0; m < mesures; m++) {
      const rythme = r.choix([[0, 4, 6, 8, 12], [0, 3, 6, 10, 12, 14], [0, 8, 10, 12], [0, 2, 4, 8, 11, 12], [0, 6, 8, 14]]);
      for (const p of rythme) {
        if (m % 4 === 3 && p > 8) continue; // respiration en fin de phrase
        deg = borne(deg + r.choix([-2, -1, -1, 1, 1, 2, 0, 3, -3]), 2, 13);
        melodie.push({ pas: m * pasParMesure + p, deg, dur: r.choix([2, 2, 3, 4, 6]) });
      }
    }
    const basse = []; for (let m = 0; m < mesures; m++) basse.push({ pas: m * pasParMesure, deg: r.choix([0, 0, 3, 4, 1]) , dur: 14 });
    const perc = opts.perc || [0, 6, 8, 11]; // taiko
    this.piste = { nom, gamme, racine, tempo, mesures, pasParMesure, melodie, basse, perc, timbre: opts.timbre || 'koto', intensite: opts.intensite || 1, boss: !!opts.boss };
    this.pas = 0; if (this.A.ctx) this.prochain = this.A.ctx.currentTime + 0.1;
  },
  arreter() { this.piste = null; },
  freq(deg) { const p = this.piste; const g = p.gamme; const oct = Math.floor(deg / g.length), i = ((deg % g.length) + g.length) % g.length; return 440 * Math.pow(2, (p.racine + 12 * oct + g[i] - 69) / 12); },
  planifier() {
    const A = this.A; if (!A || !A.ctx || !this.piste || A.ctx.state !== 'running') return;
    const p = this.piste, spb = 60 / p.tempo / 4; // secondes par double-croche
    // fondu des percussions selon l'état de combat

    g.setTargetAtTime(this.combat * p.intensite, A.ctx.currentTime, 0.3);

      for (const n of p.basse) if (n.pas === s) this.basse(n.deg, t, n.dur * spb);

      if (p.perc.includes(dans)) A.taiko(t, (dans === 0 ? 0.55 : 0.32) * (p.boss ? 1.2 : 1), this.gPerc);
      if (dans % 2 === 1 && p.boss) A.souffle(t, 0.03, 0.05, 'highpass', 6000, 0, 1, this.gPerc);
      if (dans === 4 || dans === 12) A.souffle(t, 0.04, 0.06, 'highpass', 5000, 0, 1, this.gPerc);

  },
  note(deg, t, dur, timbre) {
    const A = this.A, f = this.freq(deg);

  },
  basse(deg, t, dur) { const f = this.freq(deg - 10); this.A.osc('triangle', f, f, t, dur, 0.09, this.gAmb, 0.05); },
  etatCombat(v) { this.cibleCombat = v ? 1 : 0; },
};

// ─── 23_pixel.js ───
// ═══════════════════════════════════════════════════════════════════════════
// Outils pixel art : cartes de caractères → toiles, contour automatique,
// miroirs, silhouettes, rotations au plus proche voisin, formes nettes.
// Tout est pré-rendu au chargement ; le jeu dessine des toiles, jamais des
// images agrandies par filtrage.
// ═══════════════════════════════════════════════════════════════════════════

const CONTOUR = '#1c1420';   // contour sombre commun à tous les sprites

  const c = toile(l, h), g = ctxDe(c); const img = g.createImageData(l, h);
  const cache = {};
  const rgb = k => cache[k] || (cache[k] = hexRgb(couleurs[k]));
  for (let y = 0; y < lignes.length && y < h; y++) {
    const r = lignes[y];
    for (let x = 0; x < r.length && x < l; x++) {
      const k = r[x]; if (k === '.' || k === ' ' || !couleurs[k]) continue;
      const [R, G, B, A] = rgb(k), i = (y * l + x) * 4;

}
function hexRgb(h) {

  h = h.replace('#', ''); if (h.length === 3) h = h.split('').map(x => x + x).join('');

}
function rgbHex(r, g, b) { return '#' + [r, g, b].map(v => borne(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join(''); }
function nuancer(hex, k) { // k<1 assombrit, k>1 éclaircit (vers le blanc)

  if (k <= 1) return rgbHex(r * k, g * k, b * k);

function melange(a, b, t) { const A = hexRgb(a), B = hexRgb(b); return rgbHex(lerp(A[0], B[0], t), lerp(A[1], B[1], t), lerp(A[2], B[2], t)); }

// Contour automatique : tout pixel transparent voisin (4-connexité) d'un pixel opaque.
function contourner(c, couleur = CONTOUR, diagonales = false) {

const _disques = new Map();
function disque(r, couleur) {
  const k = r + '|' + couleur; let c = _disques.get(k); if (c) return c;
  const d = Math.max(1, Math.round(r * 2)); c = toile(d, d); const g = ctxDe(c); g.fillStyle = couleur;
  const rr = d / 2;
  for (let y = 0; y < d; y++) { const dy = y + 0.5 - rr; const w = Math.sqrt(Math.max(0, rr * rr - dy * dy)); const x0 = Math.round(rr - w), x1 = Math.round(rr + w); if (x1 > x0) g.fillRect(x0, y, x1 - x0, 1); }

}
const _ellipses = new Map();
function ellipse(rx, ry, couleur) {
  rx = Math.max(1, Math.round(rx)); ry = Math.max(1, Math.round(ry));
  const k = rx + '|' + ry + '|' + couleur; let c = _ellipses.get(k); if (c) return c;
  c = toile(rx * 2, ry * 2); const g = ctxDe(c); g.fillStyle = couleur;
  for (let y = 0; y < ry * 2; y++) { const dy = (y + 0.5 - ry) / ry; const w = rx * Math.sqrt(Math.max(0, 1 - dy * dy)); const x0 = Math.round(rx - w), x1 = Math.round(rx + w); if (x1 > x0) g.fillRect(x0, y, x1 - x0, 1); }
  _ellipses.set(k, c); return c;
}

function anneau(r, ep, couleur) {
  r = Math.max(1, Math.round(r)); const k = r + '|' + ep + '|' + couleur; let c = _anneaux.get(k); if (c) return c;
  const d = r * 2 + 2; c = toile(d, d); const g = ctxDe(c); g.fillStyle = couleur;
  for (let y = 0; y < d; y++) for (let x = 0; x < d; x++) { const q = Math.hypot(x + 0.5 - d / 2, y + 0.5 - d / 2); if (q <= r && q > r - ep) g.fillRect(x, y, 1, 1); }

}

function lignePixel(g, x0, y0, x1, y1, couleur, ep = 1) {
  x0 |= 0; y0 |= 0; x1 |= 0; y1 |= 0; g.fillStyle = couleur;

function poser(g, c, x, y, ax = 0.5, ay = 0.5) { g.drawImage(c, Math.round(x - c.width * ax), Math.round(y - c.height * ay)); }

// La tête et le corps sont séparés : on tire dans une direction en marchant
// dans une autre. Coiffures dessinées à la main ; contour automatique.
// Codes des cartes de tête : h/g/H cheveux (base/lumière/ombre), b bandeau,
// p/P plaque, k/K masque, r rouge, v violet, m traits sombres, s peau,
// e/w œil/éclat (surcharge), c/C couleurs propres au personnage.
// ═══════════════════════════════════════════════════════════════════════════

const PEAU = { s: '#f4c8a2', d: '#d69a78', l: '#fde2cc' };
const TETE_RANGS = { 6: [10, 15], 7: [8, 17], 8: [7, 18], 9: [6, 19], 10: [5, 20], 11: [5, 20], 12: [4, 21], 13: [4, 21], 14: [4, 21], 15: [4, 21], 16: [4, 21], 17: [5, 20], 18: [5, 20], 19: [6, 19], 20: [8, 17] };

function carteTeteBase(vue) {
  const L = []; for (let y = 0; y < 22; y++) L.push(Array(26).fill('.'));
  for (const [y, [a, b]] of Object.entries(TETE_RANGS)) for (let x = a; x <= b; x++) {
    let k = 's';
    if (x >= b - 1 && y >= 11) k = 'd';
    if (y >= 19) k = 'd';
    if (y <= 8 && x <= a + 2 && x >= a) k = 'l';
    L[y][x] = k;
  }
  const oeil = (x0) => { L[13][x0] = 'w'; L[13][x0 + 1] = 'e'; L[13][x0 + 2] = 'e'; for (let x = x0; x < x0 + 3; x++) { L[14][x] = 'e'; L[15][x] = 'e'; } L[16][x0 + 1] = 'e'; };
  if (vue === 'face') { oeil(7); oeil(16); L[18][12] = 'm'; L[18][13] = 'm'; }
  else if (vue === 'cote') { oeil(16); L[18][19] = 'm'; L[18][18] = 'm'; L[14][6] = 'd'; L[15][6] = 'd'; L[15][7] = 'd'; }
  return L;
}

// Corps procéduraux (14 × 11) : modes standard / combinaison / veste / manteau
function carteCorps(vue, frame, mode) {
  const vide = () => Array(14).fill('.');
  const L = []; for (let y = 0; y < 11; y++) L.push(vide());
  const set = (y, s) => { for (let x = 0; x < s.length; x++) if (s[x] !== '.') L[y][x] = s[x]; };
  const pas = frame % 2 === 1; const cotePas = frame === 1 ? 1 : frame === 3 ? -1 : 0;
  if (vue === 'face' || vue === 'dos') {
    set(0, '....cccccc....');
    set(1, '..tttttttttt..');
    set(2, '.atttttttttTA.');
    set(3, '.atttttttttTA.');
    set(4, '.atttttttttTA.');
    set(5, vue === 'face' ? '.kttttttttttk.' : '.kTTTTTTTTTTk.');
    set(6, '..eeeeeeeeee..');
    if (mode === 'manteau') {
      for (let y = 1; y <= 9; y++) for (let x = 2; x <= 11; x++) L[y][x] = (x >= 10 ? 'T' : 't');
      set(5, '.kttttttttttk.'); for (let x = 2; x <= 11; x++) L[6][x] = 't';
      set(9, pas ? '..tttttttttt..' : '..tttttttttt..');
      set(10, cotePas > 0 ? '...ff....fff..' : cotePas < 0 ? '..fff....ff...' : '..fff....fff..');
      return L;
    }
    const jambe = (x0, leve) => { const y0 = leve ? 6 : 7; for (let y = y0; y <= y0 + 2; y++) for (let x = x0; x < x0 + 4; x++) L[y][x] = (x === x0 + 3 ? 'P' : 'p'); for (let x = x0; x < x0 + 4; x++) L[y0 + 3][x] = 'f'; };
    jambe(2, cotePas === 1); jambe(8, cotePas === -1);
    if (mode === 'veste') { for (const y of [1, 2, 3, 4]) { L[y][2] = 'v'; L[y][3] = 'v'; L[y][10] = 'v'; L[y][11] = 'V'; } L[1][4] = 'v'; L[1][9] = 'v'; }
  } else { // côté, tourné vers la droite
    set(0, '.....cccc.....');
    set(1, '....tttttt....');
    set(2, '....tttttTT...');
    set(3, '....ttttttT...');
    set(4, '....ttttttT...');
    set(5, '....tttttTT...');
    set(6, '....eeeeeee...');
    if (mode === 'manteau') {
      for (let y = 1; y <= 9; y++) for (let x = 4; x <= 10; x++) L[y][x] = x >= 9 ? 'T' : 't';
      set(10, pas ? '...ff....ff...' : '....fffff.....');
      const bx = pas ? (frame === 1 ? 8 : 5) : 7; L[3][bx] = 'a'; L[4][bx] = 'a'; L[5][bx] = 'k';
      return L;
    }
    if (!pas) { set(7, '.....ppppP....'); set(8, '.....ppppP....'); set(9, '.....ppppP....'); set(10, '.....fffff....'); }
    else { set(7, '....pP..pP....'); set(8, '...pP....pP...'); set(9, '..pP......pP..'); set(10, '..ff......fff.'); }
    const bx = pas ? (frame === 1 ? 9 : 5) : 7; const by = pas ? 2 : 3;
    L[by][bx] = 'a'; L[by + 1][bx] = 'a'; L[by + 2][bx] = 'a'; L[Math.min(6, by + 3)][bx] = 'k';
    if (mode === 'veste') { for (const y of [1, 2, 3, 4, 5]) { L[y][4] = 'v'; L[y][9] = 'V'; } }
  }
  return L;
}

// Couleurs d'yeux par style
function couleursYeux(style) {
  switch (style) {
    case 'byakugan': return { e: '#c9c2e6', w: '#ffffff' };
    case 'cerne': return { e: '#2a8a84', w: '#d8fff4' };
    case 'kakuzu': return { e: '#3aa060', w: '#c8303a' };
    case 'sharingan': return { e: '#c81e28', w: '#ffd0d0' };
    case 'rinnegan': return { e: '#8a78c8', w: '#e8e0ff' };
    default: return { e: '#1c1420', w: '#ffffff' };
  }
}

// Assemble une tête (vue, état) → toile 26×22 contournée
function construireTete(V, vue, etat) {
  const base = carteTeteBase(vue === 'dos' ? 'dos' : vue);
  const co = COIFFURES[V.coiffure][vue];
  for (let y = 0; y < co.length; y++) for (let x = 0; x < co[y].length && x < 26; x++) { const k = co[y][x]; if (k !== '.') base[y][x] = k; }
  // Style des yeux (avant clignement)
  if (vue !== 'dos') {
    const st = V.yeux || 'normal';
    if (st === 'etroit') for (let y = 13; y <= 14; y++) for (let x = 0; x < 26; x++) if (base[y][x] === 'e' || base[y][x] === 'w') base[y][x] = y === 13 ? 'm' : 's';
    if (st === 'cerne') { for (let y = 12; y <= 17; y++) for (let x = 0; x < 26; x++) if ((base[y][x] === 's' || base[y][x] === 'd') && [[0, 1], [0, -1], [1, 0], [-1, 0]].some(([dx, dy]) => { const q = (base[y + dy] || [])[x + dx]; return q === 'e' || q === 'w'; })) base[y][x] = 'C'; }
    if (st === 'fente') for (let y = 13; y <= 16; y++) for (let x = 0; x < 26; x++) if (base[y][x] === 'e' && (x === 7 || x === 9 || x === 16 || x === 18)) base[y][x] = 'Y';
    if (V.sourcils) { for (const [x0, x1] of [[6, 10], [15, 19]]) for (let x = x0; x <= x1; x++) { if (vue === 'cote' && x < 14) continue; base[12][x] = 'h'; base[11][x] = x === x0 || x === x1 ? base[11][x] : 'h'; } }
  }
  if (etat === 'cligne' || etat === 'tir') {
    // yeux fermés : on garde la ligne la plus basse de chaque œil
    for (let x = 0; x < 26; x++) {
      let bas = -1; for (let y = 12; y <= 17; y++) if (['e', 'w', 'Y'].includes(base[y][x])) bas = y;
      if (bas < 0) continue;
      for (let y = 12; y <= 17; y++) if (['e', 'w', 'Y'].includes(base[y][x])) base[y][x] = (etat === 'tir' ? y === bas - 1 : y === bas) ? 'e' : 's';
    }
    if (etat === 'tir' && vue === 'face') { base[18][12] = 'm'; base[18][13] = 'm'; base[19][12] = 'M'; base[19][13] = 'M'; }
  }
  const yeux = couleursYeux(V.yeux);
  const couleurs = Object.assign({ s: PEAU.s, d: PEAU.d, l: PEAU.l, m: '#6a3424', M: '#a04040', C: '#1c1420', Y: '#e8e0d0' }, yeux, V.c);
  if (V.yeux === 'fente') couleurs.Y = '#f0e6c8';
  return contourner(peindre(base.map(r => r.join('')), couleurs, 26, 22));
}

  const couleurs = Object.assign({ k: PEAU.s }, P);
  if (V.nuages) { couleurs.n = '#c8303a'; couleurs.N = '#f0ece4'; // nuages rouges bordés de blanc sur le manteau
    const pos = vue === 'cote' ? [[5, 3], [7, 7]] : [[3, 3], [9, 6], [5, 8]];
    for (const [x, y] of pos) if (L[y] && (L[y][x] === 't' || L[y][x] === 'T')) { L[y][x] = 'n'; if (L[y][x + 1] === 't') L[y][x + 1] = 'N'; }
  }
  return contourner(peindre(L.map(r => r.join('')), couleurs, 14, 11));
}
function construireDos(V, vue) {
  if (!V.dos) return null;
  if (V.dos === 'gourde') {
    const face = ['...oo...', '..oppo..', '.oppppo.', '.opppPo.', '..oPPo..', '.oppppo.', 'oppppppo', 'opppppPo', 'oppppPPo', '.oPPPPo.', '..oooo..'];
    return contourner(peindre(face, { o: '#8a6a3a', p: '#d0a868', P: '#a8844a' }, 8, 11));
  }
  if (V.dos === 'marionnette') {
    const m = ['..wwww..', '.wWwwWw.', '.wwwwww.', 'wWwwwwWw', 'wwwwwwww', 'wwWwwWww', '.wwwwww.', '.wWwwWw.', '..wwww..'];
    return contourner(peindre(m, { w: '#e6dcc4', W: '#b8a888' }, 8, 9));
  }
  return null;
}

// Construit toutes les images d'un personnage : tetes[vue][etat], corps[vue][frame]
const _cachePersos = {};
function spritesPerso(cle) {
  if (_cachePersos[cle]) return _cachePersos[cle];
  const V = VISUELS[cle] || VISUELS.naruto; const S = { tetes: {}, corps: {}, dos: {} };
  for (const vue of ['face', 'cote', 'dos']) {
    S.tetes[vue] = {}; for (const e of ['normal', 'cligne', 'tir']) S.tetes[vue][e] = construireTete(V, vue, e);
    S.corps[vue] = []; for (let f = 0; f < 4; f++) S.corps[vue].push(construireCorps(V, vue, f));
  }
  S.tetes.gauche = {}; for (const e of ['normal', 'cligne', 'tir']) S.tetes.gauche[e] = miroir(S.tetes.cote[e]);
  S.corps.gauche = S.corps.cote.map(miroir);
  S.dosAcc = construireDos(V, 'dos');
  _cachePersos[cle] = S; return S;
}
// Dessine un personnage : dirCorps / dirTete ∈ haut|bas|gauche|droite
function dessinerPerso(g, cle, x, y, o = {}) {
  const S = spritesPerso(cle);
  const vueDe = d => d === 'haut' ? 'dos' : d === 'bas' ? 'face' : d === 'gauche' ? 'gauche' : 'cote';
  const vc = vueDe(o.dirCorps || 'bas'), vt = vueDe(o.dirTete || o.dirCorps || 'bas');
  const f = o.frame || 0; const bob = (f % 2 === 1) ? -1 : 0;
  const corps = S.corps[vc][f], tete = S.tetes[vt][o.etatTete || 'normal'];
  const X = Math.round(x), Y = Math.round(y);
  // accessoire de dos : derrière le corps sauf vue de dos
  if (S.dosAcc && vc !== 'dos') g.drawImage(S.dosAcc, X - 4 + (vc === 'cote' ? -5 : vc === 'gauche' ? 5 : 5), Y - 16);
  g.drawImage(corps, X - 7, Y - 11 + (o.dy || 0));
  if (S.dosAcc && vc === 'dos') g.drawImage(S.dosAcc, X - 4, Y - 13);
  g.drawImage(tete, X - 13, Y - 32 + bob + (o.etatTete === 'tir' ? 1 : 0) + (o.dy || 0));
}
