# Synergies SYN_001 à SYN_040 — règles de jeu (création originale) ; aucune consommation d'emplacement.
# Règles communes (§B8.2) : effets SECONDAIRE, profondeur max 2, pas d'auto-déclenchement, ICD par propriétaire.
# boss_isole : comportement lorsqu'il n'y a qu'une cible.
- id: SYN_001
  nom: Conduction
  statut: CO
  references:
  - E_SUITON
  - E_RAITON
  - STA_03
  condition: Une attaque Suiton admissible (tag E_SUITON, non SECONDAIRE) applique Trempé (Conducteur) 2 s ; une attaque Raiton
    directe (non SECONDAIRE) touche une cible Trempée.
  effet: Consomme Trempé et crée jusqu'à 2 arcs vers les ennemis à ≤ 4 m. Chaque arc = 30 % des dégâts de BASE de l'attaque
    déclenchante × A (Puissance du joueur) × V × R de la cible touchée ; ni M, ni critique.
  limite: 1 déclenchement / 0,6 s par propriétaire ; les arcs portent SECONDAIRE et ne redéclenchent pas Conduction.
  plafond: 2 arcs (3 avec PAS_037 niv. 5).
  compatibilite: Tous personnages disposant d'au moins une technique E_SUITON et une E_RAITON (ou Ranton, qui compte pour
    les deux).
  contrepartie: 'Consomme Trempé : incompatible dans le même instant avec Évaporation (SYN_028) — l''état est pris par le
    premier effet résolu (ordre : Conduction puis Évaporation).'
  manifestation: 'Cible Trempée : petites gouttes qui tombent (2 px) + motif électrique en pointillés ; déclenchement : 2
    trajets d''arcs construits en 2 frames, son sec unique.'
  boss_isole: 'Sans cible secondaire, l''arc se referme sur la cible déclenchante : 1 arc à 40 % au lieu de 2 × 30 %, et la
    cible reste Trempée 0,5 s supplémentaire.'
- id: SYN_002
  nom: Flaque électrique
  statut: CO
  references:
  - SURF_EAU
  - E_RAITON
  - STA_04
  condition: Une attaque Raiton touche le sol ou un ennemi situé sur une surface EAU.
  effet: Toute la flaque connexe (cellules EAU contiguës) Électrise les ennemis qui s'y trouvent et leur inflige 20 % des
    dégâts de base de l'attaque.
  limite: 1 fois / 1 s par flaque ; Électrisé respecte son délai interne par cible.
  plafond: 20 ennemis touchés par déclenchement.
  compatibilite: Toute source d'EAU (techniques Suiton, EQP_017, cartes à eau) + Raiton.
  contrepartie: —
  manifestation: La flaque s'illumine en bleu-blanc 3 frames avec un quadrillage d'arcs ; son de grésillement étalé.
  boss_isole: Le boss sur la flaque subit 35 % au lieu de 20 %.
- id: SYN_003
  nom: Embrasement
  statut: CO
  references:
  - SURF_HUILE
  - E_KATON
  - STA_02
  - STA_01
  condition: Une attaque Katon touche une surface HUILE ou un ennemi Imbibé d'huile.
  effet: 'La nappe devient flamme 3 s : 8 dégâts / 0,5 s × A ; +2 cumuls de Brûlure aux ennemis dessus ; consomme l''huile.'
  limite: 1 embrasement / 1 s par nappe (0,5 s avec EQP_029).
  plafond: 400 cellules actives (plafond de surface).
  compatibilite: Katon + source d'huile (JUT_010, PAS_036, EQP_029, Fukasaku et Shima).
  contrepartie: L'huile consommée n'est plus disponible pour d'autres combos.
  manifestation: Propagation cellule par cellule en 0,15 s (front visible), fumée noire au-dessus, crépitement grave.
  boss_isole: Un boss Imbibé subit 1 embrasement direct de 60 × A (1 fois / 4 s).
- id: SYN_004
  nom: Flammes attisées
  statut: CO
  references:
  - E_FUTON
  - E_KATON
  - ZONE
  condition: Une attaque Fūton (CONE, ONDE ou ZONE) chevauche une zone Katon persistante du joueur.
  effet: La zone Katon gagne +30 % de rayon et +1 s de durée, une fois par instance.
  limite: Une fois par instance de zone.
  plafond: Rayon final ≤ 150 % du rayon avant bonus.
  compatibilite: Katon + Fūton (Asuma, Jiraiya, Minato, Madara, Hiruzen, Kakuzu, Temari via partage de run…).
  contrepartie: Aucune ; le recul Fūton est réduit dans la zone (§B8.4).
  manifestation: La zone se gonfle en 4 frames, flammes couchées dans l'axe du vent.
  boss_isole: Inchangé (bonus de zone utile autour du boss).
