# Boss BOS_013 à BOS_040. Fiches intégrales : BOS_013 (Pain), BOS_016 (Madara). Détaillées : BOS_015, BOS_017.
- id: BOS_013
  nom: "Pain (Six Chemins)"
  statut: OA
  niveau_detail: integral
  cartes: [MAP_012]
  role_carte: final
  pv: 130000
  resistance: 0.25
  silhouette: "Six corps de 30 px à piercings et manteaux distincts (couleur de bordure par chemin) ; Tendō au centre."
  hitbox: "Chaque corps 0,45 m ; les 6 partagent une barre de PV commune ; un corps vaincu est « rappelé » par Jigokudō s'il vit encore."
  entree: "2,5 s : les six corps atterrissent un à un autour du joueur à 10 m (jamais à moins de 8 m)."
