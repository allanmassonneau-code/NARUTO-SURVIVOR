    - {seuil: "35–0 %", changements: "Tendō seul : Shinra Tensei et Bansho Ten'in en alternance ; Chibaku Tensei à 10 %."}
  attaques:
    - {nom: "Chemin animal — Invocations", zone: "Rhinocéros en ligne (2 m × 14 m) et chiens qui se divisent", avertissement: 1.0, active: 1.5, degats: 24, recuperation: 1.5, reponse: "Sortir de la ligne ; tuer les chiens avant division (ils se divisent à chaque coup, max 4)", info: visible}
    - {nom: "Chemin d'Asura — Missiles", zone: "6 missiles à tête chercheuse lente (virage 90°/s), explosion 2 m", avertissement: 0.8, active: 3.0, degats: 18, recuperation: 1.2, reponse: "Faire des virages serrés (les missiles décrochent)", info: visible}
    - {nom: "Chemin des Pretas — Absorption", zone: "Bulle de 3 m autour du corps : absorbe les projectiles du joueur (le soigne 0,5 % par projectile)", avertissement: 0.6, active: 3.0, degats: 0, recuperation: 1.0, reponse: "Frapper au contact ou avec DIFFERE ; ne pas tirer dans la bulle", info: visible}
    - {nom: "Shinra Tensei", zone: "Onde de 7 m autour de Tendō : repousse le joueur de 4 m (déplacement annoncé) et détruit ses projectiles", avertissement: 1.2, active: 0.2, degats: 28, recuperation: 5.0, reponse: "S'éloigner avant l'onde ; la recharge de 5 s est la fenêtre d'attaque (compteur visible sur le boss)", info: visible}
    - {nom: "Bansho Ten'in", zone: "Attire le joueur de 5 m vers Tendō (ligne de force visible), puis coup de tige", avertissement: 1.0, active: 0.5, degats: 22, recuperation: 1.5, reponse: "Esquiver au moment de l'attraction (l'esquive annule la traction)", info: apprise}
    - {nom: "Chibaku Tensei", zone: "Noyau au-dessus de la place : attire tout ce qui n'est pas ancré ; zones sûres : 4 piliers de rue (cercles de 2 m)", avertissement: 3.0, active: 4.0, degats: 12, recuperation: 6.0, reponse: "Se placer près d'un pilier ; attaquer Tendō immobile pendant la canalisation", info: apprise}
  vulnerabilites: "Recharge de 5 s après Shinra Tensei (+25 %) ; Tendō immobile pendant Chibaku Tensei."
  controle: "Rc 25 % ; chaque corps a sa propre résistance (les contrôles tournent)."
  conclusion: "Les corps tombent un par un (0,2 s d'écart), la pluie s'arrête ; 1,8 s (raccourcissable)."
