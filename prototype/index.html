const W=640,H=360,M=16,DT=1/60,TAU=Math.PI*2,AW=3200,AH=3200,BOSS_T=300,BOSS_HP=5000,XP_MUL=2;

let R=1;
function resize(){const w=innerWidth,h=innerHeight;let s=Math.min(w/W,h/H);if(s>=1)s=Math.floor(s);const dpr=window.devicePixelRatio||1;
 cv.style.width=Math.round(W*s)+'px';cv.style.height=Math.round(H*s)+'px';R=Math.max(1,s*dpr);cv.width=Math.round(W*R);cv.height=Math.round(H*R);}

// ---------- utilitaires
const clamp=(v,a,b)=>v<a?a:v>b?b:v,hyp=Math.hypot;
function angDiff(a,b){let d=((a-b)%TAU+TAU)%TAU;return d>Math.PI?TAU-d:d;}
function fr(n,d){d=d===undefined?1:d;let s=n.toFixed(d);if(s.includes('.'))s=s.replace(/0+$/,'').replace(/\.$/,'');return s.replace('.',',');}
function mmss(t){t=Math.max(0,Math.floor(t));return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function wpick(obj,r){let tot=0;for(const k in obj)tot+=obj[k];let x=r()*tot;for(const k in obj){if((x-=obj[k])<0)return k;}return Object.keys(obj)[0];}
function inArc(px,py,cx,cy,dir,half,r){const d=hyp(px-cx,py-cy);return d<=r&&(d<4||angDiff(Math.atan2(py-cy,px-cx),dir)<=half);}
function inLine(px,py,ox,oy,dir,len,hw){const dx=px-ox,dy=py-oy,c=Math.cos(dir),s=Math.sin(dir);const a=dx*c+dy*s,b=-dx*s+dy*c;return a>=0&&a<=len&&Math.abs(b)<=hw;}

function ninja(x,y,p,face,fm,s,extra){
 s=s||1;x=Math.round(x);y=Math.round(y);
 const r=(dx,dy,w,h,c)=>{if(!c)return;ctx.fillStyle=c;ctx.fillRect(x+(face<0?-dx-w:dx)*s,y+dy*s,w*s,h*s);};
 const lg=fm&1;
 r(-3,-4-(lg?1:0),2,4,p.leg);r(1,-4-(lg?0:1),2,4,p.leg);
 r(-4,-10,8,6,p.body);r(-4,-10,8,1,p.sh);
 r(3,-9+(lg?1:0),2,4,p.body);r(-5,-9+(lg?0:1),2,3,p.body);
 r(-3,-15,6,5,p.skin);
 r(-4,-17,8,2,p.hair);r(-4,-15,1,2,p.hair);
 if(p.spiky){r(-5,-18,2,1,p.hair);r(-1,-19,2,2,p.hair);r(3,-18,2,1,p.hair);r(-5,-16,1,2,p.hair);}
 if(p.band){r(-3,-15,6,1,p.band);if(p.plate)r(0,-15,2,1,p.plate);}
 if(p.mask)r(-3,-12,6,2,p.mask);
 if(!p.solid)r(1,-13,1,1,'#15151a');
 if(extra)extra(r,p);
}
function outlined(x,y,p,face,fm,s,op,extra){for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]])ninja(x+dx,y+dy,op,face,fm,s,extra);ninja(x,y,p,face,fm,s,extra);}

 JUT_217:{nom:'Kage Bunshin no Jutsu',court:'Kage Bunshin',lv:[null,'1 clone toutes les 5 s, durée 4 s, 18 par frappe','Durée des clones 4 → 5 s','Dégâts 18 → 23 par frappe','Deux clones invoqués, plafond 2','La dernière frappe repousse les ennemis (1,2 m)','Délai d’invocation 5 → 4 s','Frappes concentrées 2 s sur une cible prioritaire','Trois clones invoqués, plafond 3'],

 tranche:{nom:'Tranche du couperet',tele:.7,active:.2,dmg:28,rec:1.0},

// ---------- état
let G={state:'title',rt:0,ui:[]},P=null;
const IN={dash:false,ult:false,joy:null,touch:false,padX:0,padY:0,bx:0,by:0};
const keys=new Set();

const EVENTS=[

function newGame(){
 const seed=(Date.now()^Math.floor(Math.random()*1e9))>>>0;
 G={state:'play',rt:G.rt,ui:[],seed,rS:rng(seed),rC:rng(seed^0x9e3779b9),rL:rng(seed^0x51ed27),time:0,
  enemies:[],clones:[],proj:[],eproj:[],gems:[],fx:[],texts:[],ground:[],dots:[],chests:[],rocks:[],
  tech:{JUT_217:{lv:1,cd:.6,evo:false}},techOrder:['JUT_217'],pas:{},pasOrder:[],
  xp:0,level:1,pending:0,kills:0,dmgBy:{},S:0,refused:new Set(),rerolls:2,cards:[],sel:0,luT:0,

  boss:null,focusT:0,focusTarget:null,evoT:6,coord:null,ult:null,ultInv:0,hpScale:1,dmgScale:1,
  lastCause:'',endT:0,win:false,evoHint:false,cpxOn:false,chestRes:null,st:null};
 P={x:AW/2,y:AH/2,r:6,hp:120,maxhp:120,fx:1,fy:0,face:1,inv:0,contactT:0,heavy:false,dashT:0,dashCd:0,dashIf:0,dvx:0,dvy:0,root:0,slow:0,walk:0,moving:false,hurtT:0};
 genRocks();recalc();P.hp=P.maxhp;
 IN.dash=IN.ult=false;

}
function testBoss(){ // raccourci de test : build de fin de run et saut à 04:50
 G.tech.JUT_217.lv=8;G.tech.JUT_281={lv:5,cd:0,charge:0};G.tech.JUT_185={lv:5,cd:0};G.techOrder.push('JUT_281','JUT_185');
 G.pas={PAS_001:3,PAS_060:1,PAS_002:2,PAS_015:2};G.pasOrder=Object.keys(G.pas);G.level=16;recalc();P.hp=P.maxhp;
 G.time=288;G.ev=EVENTS.findIndex(e=>e.t>=288);G.tech.JUT_217.evo=true;
}
function genRocks(){const r=rng(G.seed^0x777);for(let i=0;i<90;i++){const x=60+r()*(AW-120),y=60+r()*(AH-120);if(hyp(x-AW/2,y-AH/2)<8*M)continue;G.rocks.push({x,y,r:10+Math.floor(r()*16)});}}
function inRock(x,y,rad){for(const k of G.rocks)if(hyp(x-k.x,y-k.y)<k.r+rad)return true;return false;}
function collideRocks(o){for(const k of G.rocks){const dx=o.x-k.x,dy=o.y-k.y,rr=k.r+o.r;if(Math.abs(dx)>rr||Math.abs(dy)>rr)continue;const d=hyp(dx,dy);if(d<rr&&d>.001){o.x=k.x+dx/d*rr;o.y=k.y+dy/d*rr;}}o.x=clamp(o.x,o.r,AW-o.r);o.y=clamp(o.y,o.r,AH-o.r);}
function banner(title,sub,dur){G.banners=[{title,sub,t:dur||3,dur:dur||3}];}
function recalc(){const l=id=>G.pas[id]||0,old=P.maxhp;
 G.st={power:.10*l('PAS_001'),cad:.07*l('PAS_002'),zone:.08*l('PAS_003'),crit:.05+.04*l('PAS_008'),move:.06*l('PAS_010'),armor:l('PAS_011'),regen:.3+.2*l('PAS_013'),pickup:.2*l('PAS_014'),hp:.1*l('PAS_015'),cloneDmg:.06*l('PAS_030'),cloneCap:l('PAS_030')>=5?1:0,rWave:.3*l('PAS_060'),rDmg:.05*l('PAS_060')};
 P.maxhp=120*(1+G.st.hp);if(P.maxhp>old)P.hp+=P.maxhp-old;P.hp=Math.min(P.hp,P.maxhp);}
const cpx=()=>P.hp<.3*P.maxhp;
const cadBonus=()=>G.st.cad+(cpx()?.15:0);
function kbStats(){const t=G.tech.JUT_217;return t.evo?EVO_KB:KBL[t.lv];}
const need=L=>5+6*L+(L>20?10*(L-20):0);
const alive=e=>e&&!e.dead&&!e.hidden&&!e.invuln;

// ---------- audio (après interaction)
let AC=null,muted=false;const sfxLast={};
function initAudio(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;}}
function beep(f,dur,type,vol,slide,delay){if(!AC||muted)return;try{const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+dur);g.gain.setValueAtTime(vol||.04,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+dur+.02);}catch(e){}}
function sfx(k){const now=performance.now(),lim={hit:45,pick:30,kunai:60,boom:60,poof:80}[k]||0;if(lim&&now-(sfxLast[k]||0)<lim)return;sfxLast[k]=now;
 switch(k){case'hit':beep(170,.04,'square',.018);break;case'pick':beep(880+Math.random()*120,.04,'sine',.025);break;case'kunai':beep(1300,.05,'triangle',.02,-500);break;
 case'charge':beep(260,.25,'sine',.03,500);break;case'boom':beep(110,.16,'sawtooth',.035,-60);break;case'poof':beep(300,.06,'triangle',.02,-150);break;
 case'lvl':beep(523,.09,'square',.035);beep(659,.09,'square',.035,0,.09);beep(784,.14,'square',.035,0,.18);break;case'hurt':beep(130,.14,'sawtooth',.05,-60);break;
 case'dash':beep(420,.08,'triangle',.03,500);break;case'warn':beep(220,.1,'square',.03);break;case'cue':beep(1560,.22,'sine',.05,-300);break;
 case'slash':beep(600,.08,'sawtooth',.03,-450);break;case'ult':beep(200,.45,'sawtooth',.05,700);break;case'chest':beep(392,.1,'square',.04);beep(523,.1,'square',.04,0,.1);beep(784,.2,'square',.04,0,.2);break;}}

// ---------- ciblage
function bestInRange(x,y,r){let b=null,bd=1e9,pr=null;for(const e of G.enemies){if(!alive(e))continue;const d=hyp(e.x-x,e.y-y)-e.r;if(d>r)continue;if((e.boss||e.elite||e.zclone)&&(!pr||d<hyp(pr.x-x,pr.y-y)-pr.r))pr=e;if(d<bd){bd=d;b=e;}}return pr||b;}
function nearestN(x,y,r,n){const a=[];for(const e of G.enemies){if(!alive(e))continue;const d=hyp(e.x-x,e.y-y);if(d<=r+e.r)a.push([d,e]);}a.sort((p,q)=>p[0]-q[0]);return a.slice(0,n).map(z=>z[1]);}
function nearestTo(x,y,px,py,leash){let b=null,bd=1e9;for(const e of G.enemies){if(!alive(e))continue;if(hyp(e.x-px,e.y-py)>leash)continue;const d=hyp(e.x-x,e.y-y);if(d<bd){bd=d;b=e;}}return b;}
function densest(x,y,range,sector){const c=[];for(const e of G.enemies){if(!alive(e))continue;const d=hyp(e.x-x,e.y-y);if(d>range)continue;if(sector&&angDiff(Math.atan2(e.y-y,e.x-x),sector.a)>sector.h)continue;c.push(e);if(c.length>=40)break;}
 let b=null,bs=-1;for(const e of c){let n=0;for(const o of c)if(hyp(o.x-e.x,o.y-e.y)<1.5*M)n++;if(n>bs){bs=n;b=e;}}return b;}
function priorityTarget(x,y,range){let b=null,bs=0;for(const e of G.enemies){if(!alive(e))continue;if(hyp(e.x-x,e.y-y)>range)continue;const s=e.boss?3:e.zclone?2:e.elite?1:0;if(s>bs){bs=s;b=e;}}return b||densest(x,y,range);}

// ---------- dégâts
function addVuln(e,a,t){e.vulns.push({a,t});}
function vulnOf(e){let v=0;for(const x of e.vulns)v+=x.a;return Math.min(.5,v);}
function addChakra(n){const room=12-G.chakraSec;n=Math.min(n,room);if(n<=0)return;G.chakraSec+=n;G.chakra=Math.min(100,G.chakra+n);}
function hit(e,base,src,o){o=o||{};if(!e||e.dead||e.invuln||e.hidden)return 0;
 const crit=Math.random()<G.st.crit;
 let d=base*(1+(o.pow===undefined?G.st.power:o.pow))*(o.mul||1)*(crit?1.5:1);
 G.chakraAcc+=d;while(G.chakraAcc>=150){G.chakraAcc-=150;addChakra(1);}
 d*=(1+vulnOf(e))*(1-Math.min(.5,e.res||0));
 e.hp-=d;e.flash=.08;G.dmgBy[src]=(G.dmgBy[src]||0)+d;
 if(o.kb){const a=o.ang!==undefined?o.ang:Math.atan2(e.y-P.y,e.x-P.x);
  if(e.boss||e.zclone)addVuln(e,.05,2); // immunisé au déplacement forcé : conversion en Vulnérable
  else{const k=o.kb*M*(e.elite?.5:1)*10;e.kvx+=Math.cos(a)*k;e.kvy+=Math.sin(a)*k;}}
 if(o.vuln)addVuln(e,.05,2);
 if(o.contact&&e.elite)counterCheck(e);
 if(G.texts.length<40)G.texts.push({x:e.x+(Math.random()-.5)*8,y:e.y-14,v:Math.max(1,Math.round(d)),t:0,crit});
 if(e.boss)bossPhase(e);else if(e.hp<=0)kill(e);
 return d;}
function kill(e){if(e.dead)return;e.dead=true;G.kills++;
 if(e.xp>0)G.gems.push({x:e.x,y:e.y,v:e.xp*XP_MUL,att:false,sp:0});
 if(e.elite){G.chests.push({x:e.x,y:e.y,t:0});addChakra(3);banner('Coffre d’élite','Marchez dessus pour l’ouvrir.',3);}
 if(e.zclone)smoke(e.x,e.y,10);sparks(e.x,e.y,3,'#e8e6e1');}
function damagePlayer(d,cause,src){ // §B1.5 : src = ennemi au contact (fenêtre globale 0,35 s ; 1 fois / 0,5 s par ennemi)
 if(G.state!=='play')return false;
 if(src&&(P.contactT>0||G.time-(src.lastHit||-9)<.5))return false;
 if(P.dashIf>0){if(G.time-G.lastPerfect>=1){G.lastPerfect=G.time;addChakra(5);G.texts.push({x:P.x,y:P.y-22,s:'Esquive parfaite',t:0,col:'#7ff0ff'});}return false;}
 if(P.inv>0||G.ultInv>0)return false;
 d=Math.max(d-G.st.armor,.25*d);
 P.hp-=d;P.hurtT=.25;P.heavy=d>=.2*P.maxhp;if(P.heavy)P.inv=.6;if(src){P.contactT=.35;src.lastHit=G.time;}
 G.takenAcc+=d;const step=P.maxhp*.1;while(G.takenAcc>=step){G.takenAcc-=step;addChakra(2);}
 G.lastCause=cause;sfx('hurt');
 if(P.hp<=0){P.hp=0;endGame(false,cause);}
 return true;}

function fan(t,L){const a0=Math.atan2(t.y-P.y,t.x-P.x),sp=30*Math.PI/180;
 for(let i=0;i<L.n;i++){const a=L.n===1?a0:a0-sp/2+sp*i/(L.n-1);
  G.proj.push({x:P.x,y:P.y,vx:Math.cos(a)*14*M,vy:Math.sin(a)*14*M,a,dmg:L.dmg,pierce:L.pierce,plant:L.plant,life:9/14,hits:new Set(),any:false,dead:false});}}
function rasenImpact(t,L,mul,src,pow,fx,fy){
 const m=mul*(1+G.st.rDmg),x=t.x,y=t.y,ang=Math.atan2(y-fy,x-fx);
 hit(t,L.imp,src,{mul:m,pow,kb:L.kb,ang,contact:true,vuln:L.vuln});
 const rad=(L.r+G.st.rWave)*M*(1+G.st.zone);
 for(const e of G.enemies){if(e===t||!alive(e))continue;if(hyp(e.x-x,e.y-y)<rad+e.r)hit(e,L.wave,src,{mul:m,pow,kb:L.kb,ang:Math.atan2(e.y-y,e.x-x),vuln:L.vuln});}
 if(L.drill)G.dots.push({e:t,n:4,dmg:6,mul:m,pow,t:.1,src});
 for(let i=0;i<3;i++)G.fx.push({k:'ring',x,y,r0:3,r1:rad*(.55+i*.22),t:0,dur:.16+i*.07,col:i?'#bfe8ff':'#ffffff'});
 sparks(x,y,6,'#9fdcff',ang);sfx('boom');}
function mkClone(x,y,dur,dmgMul,noCpx,extra){const c={isClone:1,x,y,r:6,life:dur,dur,born:G.time,atkT:.2,tgt:null,retT:0,face:1,walk:0,dmgMul,noCpx,extra:!!extra};G.clones.push(c);smoke(x,y,8);return c;}
function summonClones(){
 const L=kbStats(),cap=Math.min(8,L.cap+(cpx()?1:0)+G.st.cloneCap),own=G.clones.filter(c=>!c.extra),done=new Set();
 for(let i=0;i<L.n;i++){
  if(own.length<cap){own.push(mkClone(clamp(P.x+(G.rL()-.5)*28,8,AW-8),clamp(P.y+(G.rL()-.5)*28,8,AH-8),L.dur,1,false));}
  else{let o=null;for(const c of own)if(!done.has(c)&&(!o||c.born<o.born))o=c;if(o){o.life=L.dur;o.born=G.time;done.add(o);smoke(o.x,o.y,4);}} // plafond : rafraîchit le plus ancien
 }
 if(L.focus){G.focusT=2;G.focusTarget=priorityTarget(P.x,P.y,10*M);}
 sfx('poof');}
function cloneStrike(c,a,base){const reach=1.2*M,m=c.dmgMul*(1+G.st.cloneDmg),pow=.75*G.st.power;
 for(const e of G.enemies){if(!alive(e))continue;const dx=e.x-c.x,dy=e.y-c.y,d=hyp(dx,dy);if(d<=reach+e.r&&(d<e.r+2||angDiff(Math.atan2(dy,dx),a)<=50*Math.PI/180))hit(e,base,'Kage Bunshin (clones)',{mul:m,pow});}
 G.fx.push({k:'slash',x:c.x,y:c.y,a,r:reach,t:0,dur:.1,half:50});sfx('hit');}
function vanish(c){smoke(c.x,c.y,6);const L=kbStats();
 if(L.push&&!c.extra){for(const e of G.enemies){if(!alive(e))continue;if(hyp(e.x-c.x,e.y-c.y)<1.5*M+e.r)hit(e,L.dmg,'Kage Bunshin (clones)',{mul:c.dmgMul*(1+G.st.cloneDmg),pow:.75*G.st.power,kb:1.2,ang:Math.atan2(e.y-c.y,e.x-c.x)});}}
 const rs=G.tech.JUT_281;
 if(rs&&!c.noCpx){const t=bestInRange(c.x,c.y,3*M);if(t){fxOrb(c.x,c.y,t.x,t.y);rasenImpact(t,RSL[rs.lv],.6,'Rasengan des clones (signature)',.75*G.st.power,c.x,c.y);}}}
function updClones(){const L=kbStats(),ccad=1+.5*cadBonus();
 for(const c of G.clones){c.life-=DT;if(c.life<=0){vanish(c);continue;}
  c.retT-=DT;
  if(G.focusT>0&&alive(G.focusTarget)&&!c.extra)c.tgt=G.focusTarget;
  else if(c.retT<=0||!alive(c.tgt)){c.tgt=nearestTo(c.x,c.y,P.x,P.y,11*M);c.retT=.25;}
  const t=c.tgt;
  if(t){const dx=t.x-c.x,dy=t.y-c.y,d=hyp(dx,dy)||1,reach=1.2*M+t.r-2;c.face=dx>=0?1:-1;
   if(d>reach){c.x+=dx/d*6*M*DT;c.y+=dy/d*6*M*DT;c.walk+=DT;}
   c.atkT-=DT*ccad;if(d<=reach+4&&c.atkT<=0){c.atkT=.9;cloneStrike(c,Math.atan2(dy,dx),L.dmg);}}
  else{const dx=P.x-c.x,dy=P.y-c.y,d=hyp(dx,dy);if(d>2*M){c.x+=dx/d*5*M*DT;c.y+=dy/d*5*M*DT;c.walk+=DT;c.face=dx>=0?1:-1;}}
  collideRocks(c);}
 G.clones=G.clones.filter(c=>c.life>0);}
function startCoord(){const t=priorityTarget(P.x,P.y,10*M);if(t&&G.clones.some(c=>!c.extra))G.coord={t:.5,target:t};}
function doCoord(){const t=G.coord.target;G.coord=null;if(!alive(t))return;
 const cl=G.clones.filter(c=>!c.extra).slice(0,4);
 cl.forEach((c,i)=>{const a=i/cl.length*TAU,ox=c.x,oy=c.y;c.x=t.x+Math.cos(a)*(t.r+10);c.y=t.y+Math.sin(a)*(t.r+10);
  G.fx.push({k:'line',x:ox,y:oy,x2:c.x,y2:c.y,t:0,dur:.18,col:'#9fdcff'});rasenImpact(t,COORD_L,1,'Rasengan coordonné (EVO_069)',.75*G.st.power,c.x,c.y);});}
function updTech(){const cad=1+cadBonus(),kb=G.tech.JUT_217;
 kb.cd-=DT*cad;if(kb.cd<=0){summonClones();kb.cd=kbStats().delay;}
 if(kb.evo){G.evoT-=DT*(1+.5*cadBonus());if(G.evoT<=0){G.evoT=6;startCoord();}}
 if(G.coord){G.coord.t-=DT;if(G.coord.t<=0)doCoord();}
 if(G.focusT>0)G.focusT-=DT;

 if(rs){const L=RSL[rs.lv];

    if(t){fxOrb(P.x+P.face*6,P.y,t.x,t.y);rasenImpact(t,L,1,'Rasengan',undefined,P.x,P.y);}else rs.cd=0;}}
  else{rs.cd-=DT*cad;if(rs.cd<=0){const t=bestInRange(P.x,P.y,3*M);if(t){rs.target=t;rs.charge=.3;rs.cd=L.delay;sfx('charge');}else rs.cd=0;}}}
 const ku=G.tech.JUT_185;
 if(ku){const L=KUL[ku.lv];ku.cd-=DT*cad;if(ku.cd<=0){const ts=nearestN(P.x,P.y,9*M,2);if(ts.length){fan(ts[0],L);if(L.dbl&&ts[1])fan(ts[1],L);ku.cd=L.delay;sfx('kunai');}else ku.cd=0;}}}

// ---------- ultime ULT_001
function tryUlt(manual){if(G.chakra<100||G.ult)return;
 const any=G.enemies.some(e=>alive(e)&&hyp(e.x-P.x,e.y-P.y)<14*M);
 if(!any){if(!manual)return;for(let i=0;i<8;i++){const a=i/8*TAU;mkClone(clamp(P.x+Math.cos(a)*4*M,8,AW-8),clamp(P.y+Math.sin(a)*4*M,8,AH-8),3,.5,true,true);}
  G.chakra=50;banner('Barrage à vide','Aucun ennemi : clones à 50 % pendant 3 s, jauge ramenée à 50.',2.5);sfx('ult');return;}
 G.chakra=0;G.ultInv=.4;
 G.ult={t:0,pts:[...Array(8)].map((_,i)=>({a:i/8*TAU,x:P.x+Math.cos(i/8*TAU)*4*M,y:P.y+Math.sin(i/8*TAU)*4*M,done:false,tx:0,ty:0}))};
 for(const p of G.ult.pts)smoke(p.x,p.y,6);banner('Barrage de Rasengan des clones','ULT_001',1.6);sfx('ult');}

 for(const e of G.enemies){if(!alive(e))continue;const d=hyp(e.x-P.x,e.y-P.y);if(d<=8*M)n++;if((e.boss||e.elite)&&d<=10*M)big=true;}
 if(n>=6||big||P.hp<.3*P.maxhp)tryUlt(false);}

 u.pts.forEach((p,i)=>{if(p.done||u.t<.4+i*.1)return;p.done=true;

  for(let k=0;k<2;k++)G.fx.push({k:'ring',x,y,r0:3,r1:rad*(.7+k*.3),t:0,dur:.2+k*.08,col:k?'#bfe8ff':'#ffffff'});
  G.fx.push({k:'line',x:p.x,y:p.y,x2:x,y2:y,t:0,dur:.2,col:'#bfe8ff'});sfx('boom');});
 if(u.t>=1.6)G.ult=null;}

// ---------- joueur
function inputVec(){let x=0,y=0;
 if(keys.has('KeyA')||keys.has('ArrowLeft'))x--;if(keys.has('KeyD')||keys.has('ArrowRight'))x++;
 if(keys.has('KeyW')||keys.has('ArrowUp'))y--;if(keys.has('KeyS')||keys.has('ArrowDown'))y++;
 x+=IN.padX+IN.bx;y+=IN.padY+IN.by;
 if(IN.joy){const dx=IN.joy.x-IN.joy.ox,dy=IN.joy.y-IN.joy.oy,d=hyp(dx,dy);if(d>3){const m=Math.min(1,d/24);x+=dx/d*m;y+=dy/d*m;}}
 const m=hyp(x,y);if(m>1){x/=m;y/=m;}return[x,y,Math.min(1,m)];}
function updPlayer(){const[ix,iy,m]=inputVec();
 if(m>.05){P.fx=ix/m;P.fy=iy/m;if(Math.abs(ix)>.1)P.face=ix>0?1:-1;}
 P.inv=Math.max(0,P.inv-DT);P.contactT-=DT;P.dashIf-=DT;P.dashCd-=DT;P.root-=DT;P.slow-=DT;P.hurtT-=DT;G.ultInv-=DT;
 if(IN.dash){IN.dash=false;if(P.dashCd<=0&&P.root<=0){const dx=m>.05?ix/m:P.fx,dy=m>.05?iy/m:P.fy;P.dashT=.18;P.dashIf=.25;P.dashCd=4;P.dvx=dx*3*M/.18;P.dvy=dy*3*M/.18;smoke(P.x,P.y,5);sfx('dash');}}
 if(IN.ult){IN.ult=false;tryUlt(true);}else autoUlt();
 let vx,vy;
 if(P.dashT>0){P.dashT-=DT;vx=P.dvx;vy=P.dvy;if(Math.floor(G.time*60)%2===0)G.fx.push({k:'ghost',x:P.x,y:P.y,face:P.face,t:0,dur:.2});}
 else{const sp=4.5*M*(1+G.st.move)*(P.slow>0?.4:1)*(P.root>0?0:1);vx=ix*sp;vy=iy*sp;}
 P.x+=vx*DT;P.y+=vy*DT;collideRocks(P);
 P.moving=m>.05&&P.root<=0;if(P.moving)P.walk+=DT;
 P.hp=Math.min(P.maxhp,P.hp+G.st.regen*DT);
 const on=cpx();if(on&&!G.cpxOn)G.texts.push({x:P.x,y:P.y-26,s:'Volonté indomptable : +15 % cadence, +1 clone',t:-.6,col:'#ffb04a'});G.cpxOn=on;}

function spawnEnemy(type,x,y){const T=ET[type],hp=T.hp*G.hpScale;
 const e={type,nom:T.nom,role:T.role,x,y,r:T.r,hp,maxhp:hp,spd:T.spd,dmg:T.dmg,xp:T.xp,elite:!!T.elite,pal:T.pal,s:T.s||1,disp:T.disp,kvx:0,kvy:0,flash:0,vulns:[],cd:1+G.rS()*2,seed:G.rS()*10,st:null,t:0,res:0,walk:0,tele:null,tele2:null};
 if(e.elite){e.guard=3;e.guardT=5;e.wcd=3;}G.enemies.push(e);return e;}
function spawnPos(dmin){dmin=dmin||24;for(let i=0;i<8;i++){const a=G.rS()*TAU,d=(dmin+G.rS()*4)*M,x=P.x+Math.cos(a)*d,y=P.y+Math.sin(a)*d;if(x>20&&y>20&&x<AW-20&&y<AH-20&&!inRock(x,y,8))return[x,y];}return null;}
function pickType(t){let sh=0;for(const e of G.enemies)if(e.role==='kunai'||e.role==='bow')sh++;const shOk=sh<4+Math.floor(t/60); // plafond de tireurs simultanés
 const w={ENM_002:t<90?1:.55};if(t>=45)w.ENM_003=.8;if(t>=75&&shOk)w.ENM_019=.15;if(t>=105)w.ENM_011=.2;if(t>=135&&shOk)w.ENM_020=.12;return wpick(w,G.rS);}

function encircle(){for(let i=0;i<30;i++){const a=i/30*TAU,x=P.x+Math.cos(a)*15*M,y=P.y+Math.sin(a)*15*M;if(x>20&&y>20&&x<AW-20&&y<AH-20&&!inRock(x,y,8))spawnEnemy('ENM_002',x,y);}}
function spawnBoss(){let x,y,k=0;do{const a=G.rL()*TAU;x=P.x+Math.cos(a)*8*M;y=P.y+Math.sin(a)*8*M;k++;}while((x<60||y<60||x>AW-60||y>AH-60||inRock(x,y,16))&&k<12);
 for(const e of G.enemies)if(!e.elite&&hyp(e.x-P.x,e.y-P.y)>12*M)e.dead=true; // la brume disperse les ennemis éloignés (sans fragments)
 const b=mkZab(x,y,false);G.boss=b;G.enemies.push(b);smoke(x,y,20);banner('Zabuza Momochi','Le Démon de la brume. Lisez les zones hachurées rouges.',4);sfx('warn');}
function director(){const t=G.time,min=t/60;G.hpScale=1+.2*min;G.dmgScale=1+.05*min;
 while(G.ev<EVENTS.length&&t>=EVENTS[G.ev].t){EVENTS[G.ev].f();G.ev++;}

 const bossOn=G.boss&&!G.boss.dying,target=bossOn?14:Math.min(150,10+t*.45),rate=bossOn?1.5:2+t*.03;

function moveE(e,vx,vy){e.x+=vx*DT;e.y+=vy*DT;if(vx||vy)e.walk+=DT;}
function counterCheck(e){if(e.guard>0&&!e.riposte){e.guard--;e.riposte=1;e.tele2={shape:'circle',x:e.x,y:e.y,r:2.2*M,t0:G.time,dur:.3};}}
function updMob(e){const dx=P.x-e.x,dy=P.y-e.y,d=hyp(dx,dy)||1,ux=dx/d,uy=dy/d,sp=e.spd*M;
 if(d>40*M&&!e.elite){const p=spawnPos();if(p){e.x=p[0];e.y=p[1];}return;}
 switch(e.role){
 case'chase':{let vx=ux,vy=uy;if(e.disp){const s=Math.sin(G.time*2+e.seed)*.35;vx+=-uy*s;vy+=ux*s;}moveE(e,vx*sp,vy*sp);break;}
 case'charge':

  else{moveE(e,ux*sp,uy*sp);e.cd-=DT;if(e.cd<=0&&d<6*M){e.st='tele';e.t=.7;e.dir=Math.atan2(dy,dx);e.tele={shape:'line',x:e.x,y:e.y,dir:e.dir,len:6*M,w:1.2*M,t0:G.time,dur:.7};}}
  break;
 case'kunai':
  if(e.st==='tele'){e.t-=DT;if(e.t<=0){const a=Math.atan2(dy,dx);G.eproj.push({x:e.x,y:e.y,vx:Math.cos(a)*9*M,vy:Math.sin(a)*9*M,a,r:3,dmg:e.dmg*G.dmgScale,life:1.4,nom:e.nom,k:'kunai'});e.st=null;e.cd=2;}}
  else{if(d>7.5*M)moveE(e,ux*sp,uy*sp);else if(d<6.5*M)moveE(e,-ux*sp,-uy*sp);else moveE(e,-uy*sp*.4,ux*sp*.4);e.cd-=DT;if(e.cd<=0&&d<10*M){e.st='tele';e.t=.5;}}
  break;
 case'bow':

  else{if(d>9.5*M)moveE(e,ux*sp,uy*sp);else if(d<7.5*M)moveE(e,-ux*sp,-uy*sp);e.cd-=DT;if(e.cd<=0&&d<10*M){e.st='aim';e.t=1;e.aim=Math.atan2(dy,dx);}}
  break;
 case'elite':

 else if(G.state==='levelup'){if(edge(14))G.sel=(G.sel+G.cards.length-1)%G.cards.length;if(edge(15))G.sel=(G.sel+1)%G.cards.length;if(edge(0))pick(G.sel);if(edge(2))reroll();}
 else if(G.state==='title'){if(edge(0)||edge(9))startGame();}
 else if(G.state==='pause'){if(edge(9)||edge(0))togglePause();}
 else if(G.state==='chest'){if(edge(0))closeChest();}
 else if(G.state==='end'){if(edge(0)&&G.rt-G.endT>.8)newGame();}
 padPrev=gp.buttons.map(q=>q.pressed);}

// ---------- boucle
let last=performance.now(),acc=0;
function frame(now){let dt=(now-last)/1000;last=now;if(dt>.25)dt=.25;G.rt+=dt;pollPad();
 if(G.state==='play'){acc+=dt;let n=0;while(acc>=DT&&n<6){tick();acc-=DT;n++;if(G.state!=='play'){acc=0;break;}}if(n>=6)acc=0;}else acc=0;
 render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);
window.__nss={tick,get G(){return G;},get P(){return P;},IN,newGame,pickNow(i){G.luT=-9;pick(i);},closeChestNow(){G.luT=-9;closeChest();}};
})();
