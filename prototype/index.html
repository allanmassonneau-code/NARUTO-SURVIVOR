function wItem(pool,r,key){key=key||'w';let tot=0;for(const c of pool)tot+=c[key];if(!pool.length||tot<=0)return null;let x=r()*tot;for(const c of pool){if((x-=c[key])<0)return c;}return pool[pool.length-1];}
function shuffle(a,r){for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function inArc(px,py,cx,cy,dir,half,r){const d=hyp(px-cx,py-cy);return d<=r&&(d<4||angDiff(Math.atan2(py-cy,px-cx),dir)<=half);}
function segDist(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,l2=dx*dx+dy*dy||1;let t=((px-ax)*dx+(py-ay)*dy)/l2;t=clamp(t,0,1);return hyp(px-(ax+dx*t),py-(ay+dy*t));}
function inLine(px,py,ox,oy,dir,len,hw){const dx=px-ox,dy=py-oy,c=Math.cos(dir),s=Math.sin(dir);const a=dx*c+dy*s,b=-dx*s+dy*c;return a>=-hw&&a<=len&&Math.abs(b)<=hw;}

function font(size,bold){ctx.font=`${bold?'700 ':''}${size}px ${FONT}`;}
function txt(s,x,y,size,col,align,bold,shadow){font(size,bold);ctx.textAlign=align||'left';ctx.textBaseline='top';if(shadow!==false){ctx.fillStyle='rgba(0,0,0,.75)';ctx.fillText(s,x+.6,y+.6);}ctx.fillStyle=col;ctx.fillText(s,x,y);}
const wrapCache=new Map();
function wrap(s,maxW,size){s=String(s==null?'':s);const k=s+'|'+maxW+'|'+size;const c=wrapCache.get(k);if(c)return c;font(size);const out=[];
 for(const para of s.split('\n')){const words=para.split(' ');let cur='';for(const w of words){const t=cur?cur+' '+w:w;if(ctx.measureText(t).width>maxW&&cur){out.push(cur);cur=w;}else cur=t;}out.push(cur);}
 if(wrapCache.size>4000)wrapCache.clear();wrapCache.set(k,out);return out;}
function para(s,x,y,maxW,size,col,lh,maxLines){const L=wrap(s,maxW,size);let n=0;for(const l of L){if(maxLines&&n>=maxLines){break;}txt(l,x,y,size,col,'left',false,false);y+=lh||size+2;n++;}return y;}
function measure(s,size,bold){font(size,bold);return ctx.measureText(s).width;}

 s=s||1;x=Math.round(x);y=Math.round(y);
 const r=(dx,dy,w,h,c)=>{if(!c)return;ctx.fillStyle=c;ctx.fillRect(x+(face<0?-dx-w:dx)*s,y+dy*s,w*s,h*s);};
 const lg=fm&1,acc=p.acc||[],large=acc.includes('large')?1:0;
 if(acc.includes('akatsuki')&&!p.solid){r(-5-large,-11,10+2*large,9,p.body);r(-4,-9,2,2,'#c83030');r(2,-6,2,2,'#c83030');r(-5-large,-11,10+2*large,1,'#e8e4dc');}
 r(-3,-4-(lg?1:0),2,4,p.leg);r(1,-4-(lg?0:1),2,4,p.leg);
 r(-4-large,-10,8+2*large,6,p.body);r(-4-large,-10,8+2*large,1,p.sh);
 if(acc.includes('gilet')&&!p.solid)r(-4,-10,8,4,'#5a7a3a');
 r(3+large,-9+(lg?1:0),2,4,p.body);r(-5-large,-9+(lg?0:1),2,3,p.body);
 if(acc.includes('gourde')&&!p.solid){r(-7,-12,4,5,'#b8946a');r(-6,-14,2,2,'#b8946a');}
 if(acc.includes('couperet')&&!p.solid){r(-9,-15,14,3,'#9aa3ad');r(-8,-14,2,1,'#20242b');}
 if(acc.includes('samehada')&&!p.solid)r(-7,-16,3,9,'#4a6a8a');
 if(acc.includes('eventail')&&!p.solid)r(-7,-15,3,8,'#c8b890');
 if(acc.includes('faux')&&!p.solid){r(-7,-18,1,12,'#6a6a6a');r(-10,-18,4,2,'#c83030');}
 r(-3,-15,6,5,p.skin);
 const hs=p.hs||'court';
 if(hs==='capuche'){r(-4,-17,8,3,p.body);r(-4,-15,1,4,p.body);r(3,-15,1,3,p.body);}
 else if(hs!=='chauve'){r(-4,-17,8,2,p.hair);r(-4,-15,1,2,p.hair);}
 if(hs==='pic'){r(-5,-18,2,1,p.hair);r(-1,-19,2,2,p.hair);r(3,-18,2,1,p.hair);r(-5,-16,1,2,p.hair);}
 if(hs==='long'){r(-5,-15,1,7,p.hair);r(-4,-15,1,6,p.hair);}
 if(hs==='queue'){r(-6,-15,2,5,p.hair);}
 if(hs==='chignon'){r(-5,-19,2,2,p.hair);r(3,-19,2,2,p.hair);}
 if(p.band&&hs!=='capuche'){r(-3,-15,6,1,p.band);r(0,-15,2,1,p.plate||'#cfd4dc');}
 if(p.mask)r(-3,-12,6,2,p.mask);
 if(!p.solid){
  if(acc.includes('masque'))r(-3,-12,6,2,'#2a2a3a');
  if(acc.includes('bandages'))r(-3,-12,6,2,'#ebe6dc');
  if(acc.includes('masquetobi')){r(-3,-15,6,5,'#f08a24');r(0,-13,1,1,'#1a1a1a');}
  else if(acc.includes('masquehaku')){r(-3,-15,6,5,'#f4f4f4');r(1,-13,1,1,'#c83030');}
  else r(1,-13,1,1,acc.includes('yeuxblancs')?'#e8e8f8':'#15151a');
  if(acc.includes('lunettes'))r(0,-13,3,1,'#3a3a3a');
  if(acc.includes('peinture'))r(-2,-13,1,2,'#8a4ab0');
  if(acc.includes('chien'))r(-9,-5,4,3,'#e8e4dc');
 }
 if(extra)extra(r,p);
}

 ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(x,y,14*s,4*s,0,0,TAU);ctx.fill();
 const dark=mix(col,'#000000',.35),light=mix(col,'#ffffff',.3);
 for(let i=0;i<(queues||0);i++){const a=Math.PI+(i-(queues-1)/2)*.28+Math.sin(t*3+i)*.08;ctx.strokeStyle=dark;ctx.lineWidth=Math.max(2,3*s);ctx.beginPath();ctx.moveTo(x-face*6*s,y-10*s);ctx.quadraticCurveTo(x-face*(16*s)+Math.cos(a)*6*s,y-22*s+Math.sin(a)*4*s,x-face*(20*s)+Math.cos(a)*10*s,y-30*s+Math.sin(a)*10*s);ctx.stroke();}
 ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(x,y-10*s,12*s,9*s,0,0,TAU);ctx.fill();
 ctx.fillStyle=light;ctx.beginPath();ctx.ellipse(x,y-7*s,7*s,5*s,0,0,TAU);ctx.fill();
 ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(x+face*10*s,y-19*s,7*s,6*s,0,0,TAU);ctx.fill();
 ctx.fillStyle=dark;ctx.fillRect(Math.round(x+face*5*s),Math.round(y-28*s),Math.round(3*s),Math.round(5*s));ctx.fillRect(Math.round(x+face*12*s),Math.round(y-28*s),Math.round(3*s),Math.round(5*s));
 ctx.fillStyle='#ffe060';ctx.fillRect(Math.round(x+face*13*s),Math.round(y-21*s),Math.max(1,Math.round(2*s)),Math.max(1,Math.round(2*s)));
 ctx.fillStyle=dark;ctx.fillRect(Math.round(x-8*s),Math.round(y-3*s),Math.round(4*s),Math.round(4*s));ctx.fillRect(Math.round(x+4*s),Math.round(y-3*s),Math.round(4*s),Math.round(4*s));}

// Transformations : statistiques extraites (s) + comportements codés quand ils ont un effet direct.
function trfStats(S,t){const s=t.s||{};
 if(s.mult)S.mult*=s.mult;if(s.pow)S.power+=s.pow;if(s.move)S.move+=s.move;if(s.armor)S.armor+=s.armor;if(s.regen)S.regen+=s.regen;if(s.cad)S.cad+=s.cad;
 if(s.chakra)S.chakra+=s.chakra;if(s.red)S.red+=s.red;if(s.zone)S.zone+=s.zone;
 const txt=t.stats+' '+t.comp;
 const m=txt.match(/[Rr]éduction des dégâts \+(\d+)/);if(m)S.red+=(+m[1])/100;
 if(/Intangible/.test(txt))S.flags.intangible=1;
 if(/Suiton ×1,3/.test(txt))S.cond.push({f:F(['E_SUITON']),dmg:.3});
 if(/taijutsu \+30/.test(txt))S.cond.push({f:F(['TAIJUTSU','CONTACT']),dmg:.3});
 if(/Mokuton : \+50 % Zone/.test(txt))S.cond.push({f:F(['E_MOKUTON']),zone:.5});
 if(t.id==='TRF_009'){const n=G.portes||1;S.cad+=.08*n;S.move+=.05*n;S.cond.push({f:F(['CONTACT']),dmg:.06*n});}
 if(/\+1,5 m de portée/.test(txt))S.portee+=1.5;}

// CPX et notes de statistiques des personnages : bonus inconditionnels extraits + conditions reconnues.
function cpxStats(S,c){const n=c.s||{};for(const k in n)applyStatKey(S,k,n[k]);

function danger(o){o.t0=G.time;o.tele=(o.tele||.8)*(G.rang.tele)*(OPT.telegraphes?1.3:1);o.act=o.act||.2;o.state='tele';o.hit=false;o.hits=0;G.hz.push(o);return o;}
function dansDanger(h,x,y,r){switch(h.shape){

 case'arc':return inArc(x,y,h.x,h.y,h.dir,h.half,h.r+r);
 case'ligne':return inLine(x,y,h.x,h.y,h.dir,h.len,h.w/2+r*.6);
 case'etoile':for(let i=0;i<h.n;i++)if(inLine(x,y,h.x,h.y,h.dir+i/h.n*TAU,h.len,h.w/2+r*.6))return true;return false;
 case'sinus':{if(h.state!=='act')return false;const al=h.head;for(const off of[0,10,20,30]){const q=sinePt(h,al-off);if(q&&hyp(x-q[0],y-q[1])<h.w/2+r)return true;}return false;}
 case'mur':{const c=h.x+Math.cos(h.dir)*h.prog,cy=h.y+Math.sin(h.dir)*h.prog;const px=-Math.sin(h.dir),py=Math.cos(h.dir);const lat=(x-c)*px+(y-cy)*py,front=(x-c)*Math.cos(h.dir)+(y-cy)*Math.sin(h.dir);
  if(Math.abs(front)>.6*M+r||Math.abs(lat)>h.w/2)return false;for(const b of h.breches)if(Math.abs(lat-b)<1*M)return false;return true;}
 case'arene':{if(h.R&&hyp(x-h.x,y-h.y)>h.R)return false;for(const s of h.sures)if(hyp(x-s.x,y-s.y)<s.r-r*.5)return false;return true;}
 case'grille':{const cx=Math.floor((x-h.x)/h.cell);return((cx%2)+2)%2===h.pair?false:hyp(x-h.x,y-h.y)<h.R;}}

function updDangers(){for(const h of G.hz){
  if(h.owner&&h.owner.dead&&!h.persist&&h.state==='tele'){h.fin=1;continue;}
  if(h.state==='tele'){if(h.suit>0&&G.time-h.t0<h.suit){h.x=P.x;h.y=P.y;}if(h.suitOwner&&h.owner){h.x=h.owner.x;h.y=h.owner.y;}
   if(G.time-h.t0>=h.tele){h.state='act';h.ta=G.time;if(h.onAct)h.onAct(h);}}
  if(h.state==='act'){const p=(G.time-h.ta)/Math.max(.01,h.act);
   if(h.shape==='sinus')h.head=p*h.len;if(h.shape==='mur')h.prog=p*h.len;
   if(h.retour&&h.shape==='ligne'){h.prog=(p<.5?p*2:(1-p)*2)*h.len;}
   const touche=h.retour&&h.shape==='ligne'?hyp(P.x-(h.x+Math.cos(h.dir)*h.prog),P.y-(h.y+Math.sin(h.dir)*h.prog))<h.w/2+P.r+3:dansDanger(h,P.x,P.y,P.r);
   const maxHits=h.retour?2:(h.persist?99:1);
   if(touche&&h.hits<maxHits&&(!h.persist||G.time-(h.lastTick||-9)>=.5)&&!(h.retour&&h.lastHalf===(p<.5))){h.hits++;h.lastTick=G.time;h.lastHalf=p<.5;
    const ok=h.dmg?hurtPlayer(h.dmg,h.cause,h.owner,h.persist?'zone':'tele'):true;
    if(ok&&h.eff)effetJoueur(h.eff,h);}
   if(h.fx&&!h.fxd){h.fxd=1;h.fx(h);}
   if(p>=1){h.fin=1;if(h.onEnd)h.onEnd(h);}}}
 G.hz=G.hz.filter(h=>!h.fin);}
function effetJoueur(e,h){if(e.slow){P.slow=Math.max(P.slow,e.slowT||2);P.slowV=Math.max(P.slowV||0,e.slow);}if(e.root){P.root=Math.max(P.root,e.root*(1-(G.resCtrl||0)));P.dashT=0;}
 if(e.pull){const a=Math.atan2(h.owner?h.owner.y-P.y:h.y-P.y,h.owner?h.owner.x-P.x:h.x-P.x);P.kvx=(P.kvx||0)+Math.cos(a)*e.pull*M*6;P.kvy=(P.kvy||0)+Math.sin(a)*e.pull*M*6;}
 if(e.push){const a=Math.atan2(P.y-h.y,P.x-h.x);P.kvx=(P.kvx||0)+Math.cos(a)*e.push*M*6;P.kvy=(P.kvy||0)+Math.sin(a)*e.push*M*6;}
 if(e.poison){G.pPoison=Math.min(10,(G.pPoison||0)+e.poison);G.pPoisonT=5;}
 if(e.noRegen)G.noRegenT=Math.max(G.noRegenT||0,e.noRegen);if(e.dashCd)P.dashCd+=e.dashCd;if(e.chakra)G.chakra=Math.max(0,G.chakra-e.chakra);
 if(e.aveugle)G.aveugleT=Math.max(G.aveugleT||0,e.aveugle);if(e.faux)for(let i=0;i<3;i++)G.faux.push({x:P.x+(G.rL()-.5)*10*M,y:P.y+(G.rL()-.5)*8*M,t:3});}
// Projectiles ennemis (§D6 : vitesse ordinaire ≤ 12 m/s, chevron d'annonce au bord)
function eTir(x,y,a,o){G.eproj.push(Object.assign({x,y,vx:Math.cos(a)*(o.v||9)*M,vy:Math.sin(a)*(o.v||9)*M,a,r:o.r||3,dmg:o.dmg,life:o.life||1.4,cause:o.cause,pierce:o.pierce,expl:o.expl,homing:o.homing,eff:o.eff,k:o.k||'kunai'},{}));}
function updEProj(){for(const b of G.eproj){if(b.homing){const a=Math.atan2(P.y-b.y,P.x-b.x);let d=a-b.a;while(d>Math.PI)d-=TAU;while(d<-Math.PI)d+=TAU;b.a+=clamp(d,-b.homing*DT,b.homing*DT);const sp=hyp(b.vx,b.vy);b.vx=Math.cos(b.a)*sp;b.vy=Math.sin(b.a)*sp;}
  if(G.gravite&&hyp(b.x-P.x,b.y-P.y)<4*M){}
  b.x+=b.vx*DT;b.y+=b.vy*DT;b.life-=DT;
  if(!b.hitP&&hyp(P.x-b.x,P.y-b.y)<P.r+b.r){b.hitP=true;if(b.expl){b.life=0;}else{if(hurtPlayer(b.dmg,b.cause,null,'proj')&&b.eff)effetJoueur(b.eff,b);if(!b.pierce)b.life=0;}}
  if(solidAt(b.x,b.y))b.life=0;
  if(b.life<=0&&b.expl&&!b.boom){b.boom=1;const h=danger({shape:'cercle',x:b.x,y:b.y,r:b.expl,tele:.01,act:.1,dmg:b.dmg,cause:b.cause});fxRing(b.x,b.y,b.expl,'#ff8040');}}
 G.eproj=G.eproj.filter(b=>b.life>0);}

let UID=1;
const XP_ROLE={poursuivant:1,chargeur:2,tireur:2,controleur:3,soigneur:3,poseur:3,protecteur:4,invocateur:4,assassin:5};
function num(txt,re,d){const m=String(txt||'').match(re);if(!m)return d;const g=m.slice(1).find(x=>x!==undefined);return g===undefined?d:+g.replace(',','.');}
function mkEnemy(id,x,y,opt){opt=opt||{};const D=ENM[id];const minute=G.time/60,rg=G.rang;
 const hpMul=(1+.10*minute)*rg.pv*(G.mode==='Endless'?1+.15*minute:1)*(opt.hpMul||1),dgMul=(1+.04*minute)*rg.dg;
 const c=D.comportement||'';
 const e={uid:UID++,id,D,nom:D.nom,role:D.role,x,y,r:D.elite?9:(/Golem|Colosse|Rhinocéros|Sanglier|Tigre|géant/.test(D.nom)?9:6),hp:D.pv*hpMul,maxhp:D.pv*hpMul,spd:D.vitesse*M,dmg:D.degats*dgMul,
  xp:(D.xp||XP_ROLE[D.role]||1),elite:!!D.elite,kvx:0,kvy:0,flash:0,vulns:[],st:null,cd:1+G.rS()*2,seed:G.rS()*10,walk:0,spawnT:.4,res:0,rc:0,
  pal:palEnnemi(D),s:D.elite?1.5:(/Golem|Colosse|géant|Rhinocéros/.test(D.nom)?1.5:1),bete:estBete(D.nom),c,
  port:(D.p&&D.p.port||(D.role==='tireur'?7:D.role==='soigneur'?7:D.role==='invocateur'?8:6))*M,atkCd:D.p&&D.p.cd||(D.role==='tireur'?2.5:D.role==='controleur'?5:D.role==='invocateur'?7:D.role==='poseur'?3.5:D.role==='soigneur'?3.5:4),

 if(D.elite&&D.modificateur&&!(G.rangId==='D'&&G.time<600))e.mods=[D.modificateur];
 if(D.elite&&G.rangId==='S'||D.elite&&G.rangId==='S+'){const m2=DATA.ennemis.filter(z=>z.elite&&z.modificateur&&z.modificateur!==D.modificateur);if(m2.length)(e.mods=e.mods||[]).push(m2[Math.floor(G.rS()*m2.length)].modificateur);}
 if(e.mods)initMods(e);

function initMods(e){for(const m of e.mods){switch(m){
 case'Contre-attaquant':e.guard=3;e.guardT=5;break;case'Barrière':e.barriere=e.maxhp*.3;break;case'Reconstitution':e.recon=2;break;
 case'Chaîne liée':break;case'Invisible':e.invisible=5*M;break;case'Brasier':e.brasier=1;break;case'Blindé frontal':e.blinde=1;break;

function eliteDefense(e,d,I,o){for(const m of e.mods){
 if(m==='Blindé frontal'){const face=Math.atan2(P.y-e.y,P.x-e.x),src=o.px!==undefined?Math.atan2(o.py-e.y,o.px-e.x):face;if(angDiff(src,face)<Math.PI/3)d*=.3;}
 if(m==='Barrière'&&e.barriere>0){const a=Math.min(e.barriere,d);e.barriere-=a;d-=a;if(I&&I.liv==='CONTACT')e.barriere-=e.maxhp*.1;}
 if(m==='Réflecteur'&&I&&(I.liv==='PROJECTILE'||I.liv==='SALVE'))d*=.4;
 if(m==='Absorption'&&e.absorb>0&&I&&(I.liv==='PROJECTILE'||I.liv==='SALVE')){e.absorb--;d=0;}
 if(m==='Contre-attaquant'&&o.contact&&e.guard>0&&!e.riposte){e.guard--;e.riposte=1;danger({shape:'cercle',x:e.x,y:e.y,r:2.2*M,tele:.3,act:.1,dmg:18*G.rang.dg,cause:'Riposte ('+e.nom+')',owner:e,suitOwner:1,onEnd:()=>{e.riposte=0;}});}}
 if(e.protege)d*=1-e.protege;
 return Math.max(0,d);}
function spawnPos(dmin){const cam=G.cam;for(let i=0;i<10;i++){const a=G.rS()*TAU,d=(dmin||23+G.rS()*5)*M,x=P.x+Math.cos(a)*d,y=P.y+Math.sin(a)*d;
  if(x<20||y<20||x>G.map.w-20||y>G.map.h-20||solidAt(x,y,8))continue;const sx=x-cam.x,sy=y-cam.y;if(sx>-2*M&&sy>-2*M&&sx<W+2*M&&sy<H+2*M)continue;return[x,y];}return null;}

function updEnemy(e){const dx=P.x-e.x,dy=P.y-e.y,d=hyp(dx,dy)||1,ux=dx/d,uy=dy/d;
 if(e.spawnT>0){e.spawnT-=DT;return;}
 updStates(e);if(e.dead)return;

 if(!peutAgir(e)){e.tele=null;return;}
 const sp=e.spd*(1-slowOf(e))*(e.enrage||1)*(G.resonT&&e.resonT>0?1.2:1),confus=hasSt(e,'STA_10');
 if(confus){const o=nearestOther(e);if(o){const a=Math.atan2(o.y-e.y,o.x-e.x);moveE(e,Math.cos(a)*sp,Math.sin(a)*sp);if(hyp(o.x-e.x,o.y-e.y)<e.r+o.r+2&&G.time-(e.lastConf||0)>1){e.lastConf=G.time;hit(o,e.dmg*.5*3,null,{sec:1});if(o.dead)CPT_RUN('kills_confus',1);}}return;}
 if(hasSt(e,'STA_16')&&e.role==='poursuivant'&&G.rS()<.02){e.perdu=.8;}
 if(e.perdu>0){e.perdu-=DT;moveE(e,Math.cos(e.seed+G.time)*sp*.5,Math.sin(e.seed+G.time)*sp*.5);return;}
 const bloque=hasSt(e,'STA_19')||immobile(e);
 if(e.mods)updMods(e,d);
 switch(e.role){
 case'poursuivant':{if(bloque)break;let vx=ux,vy=uy;if(/dispersion|ondulante/.test(e.c)){const s=Math.sin(G.time*2+e.seed)*(/ondulante/.test(e.c)?.7:.35);vx+=-uy*s;vy+=ux*s;}
  if(e.cibleClone){const c=cloneProche(e);if(c){const a=Math.atan2(c.y-e.y,c.x-e.x);vx=Math.cos(a);vy=Math.sin(a);}}
  moveE(e,vx*sp,vy*sp);break;}
 case'chargeur':{if(e.st2==='tele'){e.t-=DT;if(e.t<=0){e.st2='dash';e.t=e.chLen/e.chV;e.tele=null;}}
  else if(e.st2==='dash'){e.t-=DT;if(!bloque)moveE(e,Math.cos(e.dir)*e.chV,Math.sin(e.dir)*e.chV);if(solidAt(e.x+Math.cos(e.dir)*e.r,e.y+Math.sin(e.dir)*e.r)&&/étourdi 1 s/.test(e.c)){e.st2=null;e.cd=4;applySt(e,['STA_11',1,'s'],null);}if(e.t<=0){e.st2=null;e.cd=4;}}
  else{if(!bloque)moveE(e,ux*sp,uy*sp);e.cd-=DT;const len=num(e.c,/(\d+) m(?! à)/,6)*M;if(e.cd<=0&&d<len+2*M){e.st2='tele';e.t=e.teleT;e.dir=Math.atan2(dy,dx);e.chLen=len;e.chV=num(e.c,/à (\d+) m\/s/,12)*M;
   e.tele={shape:'ligne',x:e.x,y:e.y,dir:e.dir,len,w:1.2*M,t0:G.time,tele:e.teleT};}}break;}
 case'tireur':case'controleur':case'poseur':case'soigneur':case'invocateur':{
  const keep=e.role==='poseur'?5*M:e.port;if(!bloque){if(d>keep+M)moveE(e,ux*sp,uy*sp);else if(d<keep-M)moveE(e,-ux*sp,-uy*sp);else moveE(e,-uy*sp*.4,ux*sp*.4);}
  e.cd-=DT;if(e.cd<=0&&d<keep+4*M&&!e.tele){e.cd=e.atkCd;attaqueRole(e,d);}
  if(e.tele&&G.time-e.tele.t0>=e.tele.tele){const f=e.teleFn;e.tele=null;if(f)f();}break;}
 case'protecteur':{if(!bloque)moveE(e,ux*sp*.85,uy*sp*.85);e.front=/frontal/.test(e.c);
  if(e.cd<=0){e.cd=8;if(/Durcissement|dôme/.test(e.c))e.durci=3;}e.cd-=DT;if(e.durci>0)e.durci-=DT;break;}
 case'assassin':{if(e.st2==='cache'){e.t-=DT;if(e.t<=0){const bx=P.x-P.fx*3*M,by=P.y-P.fy*3*M;e.x=clamp(bx,20,G.map.w-20);e.y=clamp(by,20,G.map.h-20);e.hidden=false;e.st2='frappe';
    danger({shape:/croissant/.test(e.c)?'arc':'cercle',x:e.x,y:e.y,r:(/croissant de (\d)/.test(e.c)?3:1.6)*M,dir:Math.atan2(P.y-e.y,P.x-e.x),half:1.1,tele:.7,act:.15,dmg:e.dmg*1.5,cause:e.nom,owner:e,onEnd:()=>{e.st2=null;}});}}
  else if(e.st2==='frappe'){}
  else{if(!bloque)moveE(e,ux*sp,uy*sp);e.cd-=DT;const vise=/PV bas|sous 50/.test(e.c)?P.hp<P.maxhp*.5:true;
   if(e.cd<=0&&d<9*M&&vise){e.cd=4.5;if(/senbon/.test(e.c)){for(let i=-1;i<=1;i++){const a=Math.atan2(P.y+P.fy*M-e.y,P.x+P.fx*M-e.x)+i*.12;e.tele={shape:'ligne',x:e.x,y:e.y,dir:a,len:8*M,w:.3*M,t0:G.time,tele:.5};}e.teleFn=()=>{for(let i=-1;i<=1;i++)eTir(e.x,e.y,Math.atan2(P.y-e.y,P.x-e.x)+i*.12,{dmg:e.dmg,v:12,cause:e.nom});};}

  else tele({shape:'ligne',x:e.x,y:e.y,dir:a,len:3*M,w:.3*M},()=>eTir(e.x,e.y,Math.atan2(P.y-e.y,P.x-e.x),{dmg,v:9,cause:nom}),.5);

 case'controleur':

const hatch=(()=>{const c=document.createElement('canvas');c.width=c.height=8;const g=c.getContext('2d');g.fillStyle='rgba(215,40,40,.30)';g.fillRect(0,0,8,8);g.strokeStyle='rgba(255,80,80,.8)';g.lineWidth=1.5;g.beginPath();g.moveTo(-2,10);g.lineTo(10,-2);g.moveTo(-2,2);g.lineTo(2,-2);g.moveTo(6,10);g.lineTo(10,6);g.stroke();return ctx.createPattern(c,'repeat');})();
function tileHash(x,y){let h=(x*374761393+y*668265263)^0x5bd1e995;h=Math.imul(h^(h>>>13),1274126177);return(h^(h>>>16))>>>0;}
function drawGround(cx,cy){const C=G.map,[c1,c2]=C.col;ctx.fillStyle='#14161b';ctx.fillRect(0,0,W,H);const T_=32,d1=mix(c1,'#000000',.08),l1=mix(c2,'#ffffff',.08);
 for(let ty=Math.floor(cy/T_);ty<=Math.floor((cy+H)/T_);ty++)for(let tx=Math.floor(cx/T_);tx<=Math.floor((cx+W)/T_);tx++){if(tx<0||ty<0||tx*T_>=C.w||ty*T_>=C.h)continue;
  const h=tileHash(tx,ty),X=tx*T_-cx,Y=ty*T_-cy;ctx.fillStyle=(h&3)===0?c1:(h&3)===1?c2:mix(c1,c2,.5);ctx.fillRect(X,Y,T_,T_);
  ctx.fillStyle=d1;ctx.fillRect(X+(h>>>4&31),Y+(h>>>9&31),2,1);ctx.fillRect(X+(h>>>14&31),Y+(h>>>19&31),1,1);ctx.fillStyle=l1;ctx.fillRect(X+(h>>>22&31),Y+(h>>>27&31),1,1);}
 ctx.strokeStyle='#0a0b0e';ctx.lineWidth=4;ctx.strokeRect(-cx,-cy,C.w,C.h);
 ctx.fillStyle='rgba(60,120,170,.55)';for(const e of C.eau){const x=e.x-cx,y=e.y-cy;if(x<-e.r||y<-e.r||x>W+e.r||y>H+e.r)continue;ctx.beginPath();ctx.arc(x,y,e.r,0,TAU);ctx.fill();}
 for(const s of G.surf){const x=s.x-cx,y=s.y-cy;if(x<-s.r||y<-s.r||x>W+s.r||y>H+s.r)continue;ctx.globalAlpha=Math.min(.5,s.t);ctx.fillStyle={HUILE:'#5a4a1a',EAU:'#3a7ab0',SABLE:'#c8a870',OMBRE:'#101018',BOIS:'#5a7a2a',GLACE:'#c8f0ff',CENDRE:'#4a4a4a',PAPIER:'#e8e4dc',LAVE:'#e04a1a'}[s.type]||'#888';
  ctx.beginPath();ctx.arc(x,y,s.r,0,TAU);ctx.fill();ctx.globalAlpha=1;}}
function drawObstacles(cx,cy,avant){for(const o of G.map.obs){const x=Math.round(o.x-cx),y=Math.round(o.y-cy);if(x<-50||y<-60||x>W+50||y>H+50)continue;if(avant!==(o.y>P.y))continue;
 if(o.k==='arbre'){ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(x+2,y+o.r*.5,o.r,o.r*.4,0,0,TAU);ctx.fill();ctx.fillStyle='#4a3420';ctx.fillRect(x-2,y-4,4,8);
  ctx.fillStyle=mix(G.map.col[0],'#0a2a0a',.45);ctx.beginPath();ctx.arc(x,y-o.r*.9,o.r*1.1,0,TAU);ctx.fill();ctx.fillStyle=mix(G.map.col[0],'#2a5a1a',.3);ctx.beginPath();ctx.arc(x-o.r*.3,y-o.r*1.2,o.r*.6,0,TAU);ctx.fill();}
 else if(o.k==='pilier'){ctx.fillStyle='rgba(0,0,0,.3)';ctx.fillRect(x-o.r+2,y-2,o.r*2,o.r);ctx.fillStyle='#6a6660';ctx.fillRect(x-o.r,y-o.r*2.2,o.r*2,o.r*2.4);ctx.fillStyle='#8a8680';ctx.fillRect(x-o.r,y-o.r*2.2,o.r*2,3);}
 else if(o.k==='bloc'){ctx.fillStyle='rgba(0,0,0,.3)';ctx.fillRect(x-o.r+3,y-o.r*.4,o.r*2,o.r*1.2);ctx.fillStyle='#6a5a4a';ctx.fillRect(x-o.r,y-o.r*1.2,o.r*2,o.r*1.6);ctx.fillStyle='#8a3a2a';ctx.fillRect(x-o.r-2,y-o.r*1.5,o.r*2+4,o.r*.5);}
 else{ctx.fillStyle='rgba(0,0,0,.28)';ctx.beginPath();ctx.ellipse(x+2,y+o.r*.55,o.r,o.r*.45,0,0,TAU);ctx.fill();ctx.fillStyle='#43464c';ctx.beginPath();ctx.arc(x,y,o.r,0,TAU);ctx.fill();ctx.fillStyle='#565a61';ctx.beginPath();ctx.arc(x-o.r*.25,y-o.r*.3,o.r*.6,0,TAU);ctx.fill();}}}
function tProg(h){return clamp((G.time-h.t0)/h.tele,0,1);}
function drawDanger(h,cx,cy){const p=h.state==='act'?1:tProg(h),x=h.x-cx,y=h.y-cy,edge=p>.82?'#ffffff':'#ff4a4a';ctx.save();ctx.translate(x,y);ctx.lineWidth=1;
 const fillShape=(f)=>{ctx.beginPath();f();ctx.fillStyle=hatch;ctx.fill();ctx.strokeStyle=edge;ctx.stroke();};
 switch(h.shape){
 case'cercle':case'croix':fillShape(()=>ctx.arc(0,0,h.r,0,TAU));ctx.globalAlpha=.35;ctx.fillStyle='#ff3030';ctx.beginPath();ctx.arc(0,0,h.r*p,0,TAU);ctx.fill();ctx.globalAlpha=1;
  if(h.shape==='croix'){ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-6,-6);ctx.lineTo(6,6);ctx.moveTo(6,-6);ctx.lineTo(-6,6);ctx.stroke();}break;
 case'arc':fillShape(()=>{ctx.moveTo(0,0);ctx.arc(0,0,h.r,h.dir-h.half,h.dir+h.half);ctx.closePath();});ctx.globalAlpha=.35;ctx.fillStyle='#ff3030';ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,h.r*p,h.dir-h.half,h.dir+h.half);ctx.fill();ctx.globalAlpha=1;break;
 case'ligne':ctx.rotate(h.dir);fillShape(()=>ctx.rect(0,-h.w/2,h.len,h.w));ctx.globalAlpha=.35;ctx.fillStyle='#ff3030';ctx.fillRect(0,-h.w/2,h.len*p,h.w);ctx.globalAlpha=1;
  if(h.retour&&h.state==='act'){ctx.fillStyle='#aab3bd';ctx.save();ctx.translate(h.prog||0,0);ctx.rotate(G.time*18);ctx.fillRect(-12,-4,24,8);ctx.restore();}break;
 case'etoile':for(let i=0;i<h.n;i++){ctx.save();ctx.rotate(h.dir+i/h.n*TAU);fillShape(()=>ctx.rect(0,-h.w/2,h.len,h.w));ctx.restore();}break;
 case'sinus':{ctx.translate(-x,-y);const pts=[];for(let al=0;al<=h.len;al+=6){const q=sinePt(h,al);pts.push([q[0]-cx,q[1]-cy]);}ctx.lineCap='round';ctx.beginPath();pts.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));
  ctx.strokeStyle=edge;ctx.lineWidth=h.w+2;ctx.stroke();ctx.strokeStyle=hatch;ctx.lineWidth=h.w;ctx.stroke();if(h.state==='act'&&h.head!==undefined)for(let i=6;i>=0;i--){const q=sinePt(h,h.head-i*6);if(!q)continue;ctx.fillStyle=i?'#4f9ad8':'#bfe4ff';ctx.beginPath();ctx.arc(q[0]-cx,q[1]-cy,i?6-i*.5:7,0,TAU);ctx.fill();}break;}
 case'mur':{ctx.rotate(h.dir);const pr=h.state==='act'?h.prog:0;ctx.fillStyle=hatch;ctx.fillRect(0,-h.w/2,h.len,h.w);ctx.strokeStyle=edge;ctx.strokeRect(0,-h.w/2,h.len,h.w);ctx.fillStyle='rgba(255,120,40,.8)';
  ctx.fillRect(pr-6,-h.w/2,12,h.w);ctx.fillStyle='rgba(40,200,80,.6)';for(const b of h.breches)ctx.fillRect(0,b-M,h.len,2*M);break;}
 case'arene':ctx.translate(-x,-y);ctx.fillStyle=hatch;if(h.R){ctx.beginPath();ctx.arc(x,y,h.R,0,TAU);ctx.fill();}else ctx.fillRect(0,0,W,H);ctx.globalCompositeOperation='destination-out';for(const s of h.sures){ctx.beginPath();ctx.arc(s.x-cx,s.y-cy,s.r,0,TAU);ctx.fill();}
  ctx.globalCompositeOperation='source-over';for(const s of h.sures){ctx.strokeStyle='#8fd14f';ctx.lineWidth=2;ctx.beginPath();ctx.arc(s.x-cx,s.y-cy,s.r,0,TAU);ctx.stroke();}ctx.globalAlpha=.25*p;ctx.fillStyle='#ff3030';ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;break;
 case'grille':ctx.translate(-x,-y);for(let gx=-8;gx<8;gx++){if(((gx%2)+2)%2===h.pair)continue;ctx.fillStyle=hatch;ctx.fillRect(x+gx*h.cell,0,h.cell,H);}ctx.strokeStyle=edge;break;}
 ctx.restore();}
function drawPlayer(cx,cy){const x=P.x-cx,y=P.y-cy,fy=y+5,fm=P.moving?Math.floor(P.walk*8)&1:0,pal=palPerso(G.chr.nom);
 ctx.strokeStyle='rgba(255,255,255,.6)';ctx.lineWidth=1;ctx.beginPath();ctx.ellipse(x,fy,8,3,0,0,TAU);ctx.stroke();
 if(G.trf&&G.trf.actif){ctx.globalAlpha=.35+.15*Math.sin(G.time*10);ctx.fillStyle='#ff7a2a';ctx.beginPath();ctx.ellipse(x,y-4,11,15,0,0,TAU);ctx.fill();ctx.globalAlpha=1;if(G.tick%4===0)G.fx.push({k:'etincelle',x:P.x+(Math.random()-.5)*14,y:P.y,vx:0,vy:-30,t:0,dur:.4,col:'#ff9a3a'});}
 const blink=OPT.clignotement&&(P.inv>0||P.hurtT>0)&&Math.floor(G.time*15)%2===0;if(blink)ctx.globalAlpha=.55;
 outlined(x,fy,pal,P.face,fm,1,OUT_P);ctx.globalAlpha=1;
 if(P.shield>0){ctx.strokeStyle='rgba(160,220,255,.7)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(x,y-4,12,0,TAU);ctx.stroke();}
 const rs=G.techs.find(I=>I.hook==='rasen');if(rs&&rs.charge>0){const ox=Math.round(x+P.face*8),oy=Math.round(fy-8);ctx.fillStyle='#7fcfff';ctx.beginPath();ctx.arc(ox,oy,4,0,TAU);ctx.fill();}
 if(P.root>0){ctx.strokeStyle='#6fb8ff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y-4,13,0,TAU);ctx.stroke();txt('Immobilisé',x,y-32,7,'#bfe4ff','center',1);}
 if(P.slow>0)txt('Ralenti',x,y-32,7,'#e8e6e1','center',1);}
function drawUnit(I,u,cx,cy){const x=u.x-cx,y=u.y-cy;if(x<-40||y<-40||x>W+40||y>H+40)return;ctx.globalAlpha=u.life<.3?Math.max(.2,u.life/.3):1;
 if(u.geant){ctx.globalAlpha*=.8;bete(x,y+10,64,I.col==='#e8e6e1'?'#e0a060':I.col,u.face,G.time,0,I.def.nom);ctx.globalAlpha=1;return;}
 if(u.clone||I.unite==='CLONE')outlined(x,y+5,desat(palPerso(G.chr.nom)),u.face,Math.floor(u.walk*8)&1,1,OUT_C);
 else if(I.unite==='ANIMAL'||estBete(I.def.nom+I.def.comp))bete(x,y+4,14,I.col,u.face,G.time,0,I.def.nom);
 else if(I.unite==='MARIONNETTE'){outlined(x,y+5,{body:'#8a6a4a',leg:'#6a4a3a',sh:'#5a3a2a',skin:'#c8a878',hair:'#3a2a1a',hs:'court'},u.face,Math.floor(u.walk*8)&1,1,OUT_A);ctx.strokeStyle='rgba(200,220,255,.3)';ctx.beginPath();ctx.moveTo(P.x-cx,P.y-cy-10);ctx.lineTo(x,y-10);ctx.stroke();}
 else{ctx.fillStyle=I.col;ctx.beginPath();ctx.arc(x,y-4,5,0,TAU);ctx.fill();ctx.strokeStyle='#8fd14f';ctx.stroke();}
 ctx.globalAlpha=1;}
function drawEnemy(e,cx,cy){const x=e.x-cx,y=e.y-cy;if(x<-80||y<-80||x>W+80||y>H+80)return;
 if(e.spawnT>0){ctx.strokeStyle='rgba(255,90,90,.7)';ctx.beginPath();ctx.arc(x,y+4,8*(1-e.spawnT/.4),0,TAU);ctx.stroke();return;}
 if(e.boss||e.lieut)return drawBoss(e,x,y);
 ctx.globalAlpha=e.alpha||1;const s=e.s,fm=Math.floor(e.walk*8)&1,face=P.x>=e.x?1:-1,fy=y+5*s;
 if(e.elite){ctx.strokeStyle='#ffd84a';ctx.lineWidth=1;ctx.beginPath();ctx.ellipse(x,fy,11,4,0,0,TAU);ctx.stroke();}
 if(e.bete){bete(x,fy,e.elite?22:14,couleurBete(e.nom),face,G.time+e.seed,nbQueues(e.nom),e.nom);if(e.flash>0){ctx.globalAlpha=.6;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,fy-6,7,0,TAU);ctx.fill();}}
 else{ctx.fillStyle='rgba(0,0,0,.3)';ctx.fillRect(Math.round(x-5*s),Math.round(fy-1),Math.round(10*s),2);const p=e.flash>0?WHITE:e.pal;
  if(e.elite&&e.guard>0&&Math.floor(G.time*6)%2===0)outlined(x,fy,p,face,fm,s,OUT_E);else ninja(x,fy,p,face,fm,s);}
 ctx.globalAlpha=1;
 if(e.tele)drawTeleMob(e,cx,cy);
 if(e.elite){const w=26;ctx.fillStyle='#20242b';ctx.fillRect(Math.round(x-w/2),Math.round(fy-36),w,3);ctx.fillStyle='#ffd84a';ctx.fillRect(Math.round(x-w/2),Math.round(fy-36),Math.round(w*Math.max(0,e.hp/e.maxhp)),3);
  if(e.mods)txt(e.mods.join(' + '),x,fy-45,6,'#ffd84a','center',1);if(e.barriere>0){ctx.strokeStyle='#b070ff';ctx.beginPath();ctx.arc(x,fy-10,14,0,TAU);ctx.stroke();}}
 if(e.clochette){ctx.fillStyle='#ffd23f';ctx.beginPath();ctx.arc(x+6,fy-24,3,0,TAU);ctx.fill();}
 if(e.st){let i=0;for(const k in e.st){if(e.st[k].t>0&&i<4){ctx.fillStyle=STA_COL[k]||'#fff';ctx.fillRect(Math.round(x-6+i*4),Math.round(fy-22*s-4),3,3);i++;}}}
 if(e.vulns&&e.vulns.length){ctx.fillStyle='#c77dff';ctx.fillRect(Math.round(x+6),Math.round(fy-22*s-4),2,2);}
 if(e.gel>0){ctx.globalAlpha=.5;ctx.fillStyle='#c8f0ff';ctx.fillRect(Math.round(x-6),Math.round(fy-18),12,18);ctx.globalAlpha=1;}}
function drawTeleMob(e,cx,cy){const t=e.tele;const p=clamp((G.time-t.t0)/t.tele,0,1);ctx.save();ctx.translate(t.x-cx,t.y-cy);
 if(t.shape==='ligne'){ctx.rotate(t.dir);if(t.vise){ctx.setLineDash([2,3]);ctx.strokeStyle=p>.8?'#fff':'#ff5050';ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(t.len,0);ctx.stroke();ctx.setLineDash([]);}
  else{ctx.fillStyle=hatch;ctx.fillRect(0,-t.w/2,t.len,t.w);ctx.strokeStyle=p>.8?'#fff':'#ff4a4a';ctx.strokeRect(0,-t.w/2,t.len,t.w);}}
 else if(t.shape==='cercle'){ctx.strokeStyle='#ff4a4a';ctx.beginPath();ctx.arc(0,0,t.r*p,0,TAU);ctx.stroke();}
 else if(t.shape==='arc'){ctx.fillStyle=hatch;ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,t.r,t.dir-t.half,t.dir+t.half);ctx.closePath();ctx.fill();}
 ctx.restore();txt('!',e.x-cx,e.y-cy-30,9,'#ff5050','center',1);}
function bossScale(e){return e.px>=160?4:e.px>=96?3:e.px>=48?2.5:2;}
function drawBoss(e,x,y){if(e.hidden)return;const s=bossScale(e),fy=y+5*s,face=e.face,fm=Math.floor(e.walk*6)&1;ctx.globalAlpha=e.alpha||(e.clone?.78:1);
 if(e.bete||e.px>=96){bete(x,fy,e.px>=160?96:e.px>=96?72:48,couleurBete(e.nom),face,G.time,nbQueues(e.nom),e.nom);if(e.flash>0){ctx.globalAlpha=.5;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,fy-20,16,0,TAU);ctx.fill();}}
 else{const pal=e.flash>0?WHITE:(e.clone?{body:'#6fa8d8',leg:'#5b92c2',sh:'#5b92c2',skin:'#9cc8ec',hair:'#4f82b4',hs:'court'}:palPerso(e.nom));ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(x,fy,6*s,2*s,0,0,TAU);ctx.fill();
  if(e.state==='mort')ninja(x,fy+6,pal,face,0,s);else outlined(x,fy,pal,face,fm,s,e.lieut?OUT_E:OUT_B);}
 ctx.globalAlpha=1;if(e.state==='fige')txt('Figé',x,fy-24*s-6,7,'#c77dff','center',1);if(vulnOf(e)>0)txt('Vulnérable +'+Math.round(vulnOf(e)*100)+' %',x,fy-24*s-14,6,'#c77dff','center',1);
 if(e.state==='trans'||e.state==='enter'){ctx.strokeStyle='rgba(255,255,255,.6)';ctx.beginPath();ctx.arc(x,fy-10*s,12*s+Math.sin(G.time*10)*2,0,TAU);ctx.stroke();}
 if(e.soin){txt('Mue : infligez 2 % de PV pour interrompre',x,fy-24*s-22,6,'#7ad04a','center',1);}
 if(e.lieut&&!e.clone){const w=60;ctx.fillStyle='#20242b';ctx.fillRect(Math.round(x-w/2),Math.round(fy-24*s-6),w,4);ctx.fillStyle='#ffb040';ctx.fillRect(Math.round(x-w/2),Math.round(fy-24*s-6),Math.round(w*Math.max(0,e.hp/e.maxhp)),4);}}
function drawTechObjs(cx,cy){for(const I of G.techs){for(const o of I.objs){const x=o.x-cx,y=o.y-cy;switch(o.k){
  case'zone':ctx.globalAlpha=.28;ctx.fillStyle=I.col;ctx.beginPath();ctx.arc(x,y,o.r,0,TAU);ctx.fill();ctx.globalAlpha=.7;ctx.strokeStyle=I.col;ctx.lineWidth=1;ctx.stroke();ctx.globalAlpha=1;break;
  case'piege':ctx.strokeStyle=o.arm>0?'rgba(255,255,255,.4)':I.col;ctx.setLineDash([2,2]);ctx.beginPath();ctx.arc(x,y,o.r,0,TAU);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle=I.col;ctx.fillRect(Math.round(x-2),Math.round(y-2),4,4);break;
  case'diff':ctx.strokeStyle='#7fcfff';ctx.setLineDash([3,3]);ctx.beginPath();ctx.arc(x,y,o.r,0,TAU);ctx.stroke();ctx.setLineDash([]);break;
  case'onde':if(o.t>=0){ctx.globalAlpha=.7;ctx.strokeStyle=I.col;ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y,o.r,0,TAU);ctx.stroke();ctx.globalAlpha=1;ctx.lineWidth=1;}break;
  case'mur':{ctx.save();ctx.translate(o.cx-cx,o.cy-cy);ctx.rotate(o.a+Math.PI/2);ctx.fillStyle=I.col;ctx.globalAlpha=.6;ctx.fillRect(-o.w/2,-4,o.w,8);ctx.restore();ctx.globalAlpha=1;break;}
  case'rayon':{ctx.save();ctx.translate(P.x-cx,P.y-cy);ctx.rotate(o.a);ctx.globalAlpha=.7;ctx.fillStyle=I.col;ctx.fillRect(0,-o.w/2,o.len,o.w);ctx.fillStyle='#fff';ctx.fillRect(0,-1,o.len,2);ctx.restore();ctx.globalAlpha=1;break;}
  default:if(o.hits!==undefined&&o.a!==undefined){ctx.save();ctx.translate(Math.round(x),Math.round(y));ctx.rotate(o.a);ctx.globalAlpha=o.hits?.9:.6;ctx.fillStyle='#15161a';ctx.fillRect(-2,-1,5,2);ctx.restore();ctx.globalAlpha=1;}}}
  if(I.orbs){const L=I.L,m=mods(I),R=(L.port+m.portee)*M*(1+m.zone);for(let i=0;i<I.orbs.n;i++){const a=I.orbs.ang+i/I.orbs.n*TAU;ctx.fillStyle=I.col;ctx.beginPath();ctx.arc(P.x-cx+Math.cos(a)*R,P.y-cy+Math.sin(a)*R,4,0,TAU);ctx.fill();ctx.strokeStyle='#fff';ctx.stroke();}}
  if(I.coord){const t=I.coord.target;if(t&&!t.dead){ctx.strokeStyle='#7fcfff';ctx.beginPath();ctx.ellipse(t.x-cx,t.y-cy+6,t.r+6,(t.r+6)*.45,0,0,TAU);ctx.stroke();}}}}
function drawFx(cx,cy){for(const f of G.fx){const p=f.t/f.dur,x=f.x-cx,y=f.y-cy;if(x<-200||y<-200||x>W+200||y>H+200)continue;
 switch(f.k){case'ring':ctx.globalAlpha=1-p;ctx.strokeStyle=f.col;ctx.lineWidth=2-p;ctx.beginPath();ctx.arc(x,y,f.r0+(f.r1-f.r0)*p,0,TAU);ctx.stroke();break;
 case'etincelle':ctx.globalAlpha=1-p;ctx.fillStyle=f.col;ctx.fillRect(Math.round(x),Math.round(y),2,2);break;
 case'fumee':ctx.globalAlpha=(1-p)*.8;ctx.fillStyle='#e9e9e4';ctx.beginPath();ctx.arc(x,y,f.r*(1+p),0,TAU);ctx.fill();break;
 case'frappe':{ctx.globalAlpha=1-p;ctx.strokeStyle=f.big?'#ffdada':f.col;ctx.lineWidth=f.big?3:2;ctx.beginPath();ctx.arc(x-Math.cos(f.a)*f.r*.5,y-Math.sin(f.a)*f.r*.5,f.r*(.7+.3*p),f.a-.9,f.a+.9);ctx.stroke();break;}
 case'cone':ctx.globalAlpha=(1-p)*.5;ctx.fillStyle=f.col;ctx.beginPath();ctx.moveTo(x,y);ctx.arc(x,y,f.r*(.6+.4*p),f.a-f.half,f.a+f.half);ctx.closePath();ctx.fill();break;
